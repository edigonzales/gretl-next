import java.net.URI

def bundledGretlVersion = System.getenv('GRETL_VERSION')
def requestedGretlVersion = System.getProperty('gretl.version')
def gretlVersion = requestedGretlVersion ?: bundledGretlVersion
if (!gretlVersion) {
    throw new GradleException('GRETL bundled version is missing from the image.')
}
if (requestedGretlVersion && requestedGretlVersion != bundledGretlVersion) {
    throw new GradleException("Requested GRETL version ${requestedGretlVersion} does not match bundled version ${bundledGretlVersion}.")
}
def localPluginRepository = new File(System.getProperty('gretl.mavenRepo', '/opt/gretl/maven-repository'))
if (!localPluginRepository.isDirectory()) {
    throw new GradleException("GRETL plugin repository is missing for version ${gretlVersion}: ${localPluginRepository}")
}
def strictOffline = System.getProperty('gretl.image.offline', 'false').toBoolean()
        || (System.getenv('GRETL_IMAGE_OFFLINE') ?: 'false').toBoolean()

def configureGretlRepositories = { repositories ->
    repositories.maven {
        name = 'gretlImagePlugins'
        url = localPluginRepository.toURI()
    }
    if (!strictOffline) {
        repositories.maven { url = URI.create('https://jars.sogeo.services/mirror') }
        repositories.maven { url = URI.create('https://repo.osgeo.org/repository/release/') }
        repositories.maven { url = URI.create('https://maven.geo-solutions.it') }
        repositories.mavenCentral()
    }
}

gradle.beforeSettings { settings ->
    settings.pluginManagement {
        repositories {
            configureGretlRepositories(delegate)
            if (!strictOffline) {
                gradlePluginPortal()
            }
        }
        plugins {
            id 'ch.so.agi.gretl' version gretlVersion
            id 'ch.so.agi.gretl.geotools' version gretlVersion
        }
    }
        settings.dependencyResolutionManagement {
            repositories {
                maven {
                    name = 'gretlImageDependencies'
                    url = localPluginRepository.toURI()
                }
            }
        }
    }
