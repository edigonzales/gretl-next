import java.net.URI

def gretlVersion = System.getProperty('gretl.version') ?: System.getenv('GRETL_VERSION')
if (!gretlVersion) {
    throw new GradleException('GRETL version is missing. Set -Dgretl.version or GRETL_VERSION.')
}
def localPluginRepository = new File(System.getProperty('gretl.mavenRepo', '/opt/gretl/maven-repository'))
if (!localPluginRepository.isDirectory()) {
    throw new GradleException("GRETL plugin repository is missing for version ${gretlVersion}: ${localPluginRepository}")
}
def enableMavenLocal = System.getProperty('gretl.enableMavenLocal', 'false').toBoolean()

def configureGretlRepositories = { repositories ->
    repositories.maven {
        name = 'gretlImagePlugins'
        url = localPluginRepository.toURI()
    }
    if (enableMavenLocal) {
        repositories.mavenLocal()
    }
    repositories.maven {
        name = 'sogeoMirror'
        url = URI.create('https://jars.sogeo.services/mirror')
    }
    repositories.maven {
        name = 'osgeoRelease'
        url = URI.create('https://repo.osgeo.org/repository/release/')
    }
    repositories.maven {
        name = 'geoSolutions'
        url = URI.create('https://maven.geo-solutions.it')
    }
    repositories.mavenCentral()
}

settingsEvaluated { settings ->
    settings.pluginManagement {
        repositories {
            configureGretlRepositories(delegate)
            gradlePluginPortal()
        }
        plugins {
            id 'ch.so.agi.gretl' version gretlVersion
            id 'ch.so.agi.gretl.geotools' version gretlVersion
        }
    }
    settings.dependencyResolutionManagement.repositories {
        maven {
            name = 'gretlImageDependencies'
            url = localPluginRepository.toURI()
        }
        if (enableMavenLocal) {
            mavenLocal()
        }
    }
}
