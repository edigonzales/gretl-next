plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

base {
    archivesName = 'gretl-core'
}

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    runtimeImageFunctionalTest {
        resources.srcDir sourceSets.test.resources
        compileClasspath += sourceSets.test.output + sourceSets.main.output
        runtimeClasspath += sourceSets.test.runtimeClasspath + output + compileClasspath
    }
    runtimeImageIntegrationTest {
        resources.srcDir sourceSets.test.resources
        resources.srcDir sourceSets.integrationTest.resources
        compileClasspath += sourceSets.integrationTest.output + sourceSets.main.output
        runtimeClasspath += sourceSets.integrationTest.runtimeClasspath + output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    runtimeImageFunctionalTestImplementation.extendsFrom testImplementation
    runtimeImageFunctionalTestRuntimeOnly.extendsFrom testRuntimeOnly
    runtimeImageIntegrationTestImplementation.extendsFrom integrationTestImplementation
    runtimeImageIntegrationTestRuntimeOnly.extendsFrom integrationTestRuntimeOnly
}

configurations.configureEach {
    // gretl-core must stay free of GeoTools. Geospatial processing belongs in gretl-geotools.
    exclude group: 'org.geotools'
    exclude group: 'org.geotools.ogc'
    resolutionStrategy.force "ch.interlis:ili2c-core:${ili2cCoreVersion}"
    resolutionStrategy.force "ch.interlis:ili2c-tool:${ili2cToolVersion}"
    resolutionStrategy.force "ch.interlis:iox-ili:${ioxIliVersion}"
    resolutionStrategy.force "ch.interlis:ili2pg:${ili2pgVersion}"
    resolutionStrategy.force "ch.interlis:ili2gpkg:${ili2gpkgVersion}"
}

dependencies {
    compileOnly project(':gretl-doclet')

    implementation "commons-io:commons-io:${commonsIoVersion}"
    implementation "commons-net:commons-net:${commonsNetVersion}"
    implementation "ch.ehi:ehisqlgen:${ehiSqlgenVersion}"
    implementation "ch.interlis:ili2c-core:${ili2cCoreVersion}"
    implementation "ch.interlis:ili2c-tool:${ili2cToolVersion}"
    implementation("ch.interlis:ili2pg:${ili2pgVersion}") {
        exclude group: 'ch.ehi', module: 'ehisqlgen'
    }
    implementation("ch.interlis:ili2gpkg:${ili2gpkgVersion}") {
        exclude group: 'ch.ehi', module: 'ehisqlgen'
    }
    implementation "ch.interlis:ili2duckdb:${ili2duckdbVersion}"
    implementation "ch.interlis:ilivalidator:${ilivalidatorVersion}"
    implementation "ch.interlis:iox-ili:${ioxIliVersion}"
    // gretl-core only uses the lightweight CSV/WKF configuration path from iox-wkf.
    // Shape and other GeoTools-backed features from that artifact are intentionally blocked here.
    implementation("ch.interlis:iox-wkf:${ioxWkfVersion}") {
        exclude group: 'ch.interlis', module: 'ili2pg'
        exclude group: 'ch.interlis', module: 'ili2gpkg'
    }
    implementation("io.github.sogis:iox-formats:${ioxFormatsVersion}") {
        exclude group: 'hsqldb', module: 'hsqldb'
    }
    implementation("io.github.sogis:av2ch:${av2chVersion}") {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
    }
    implementation("ch.interlis:av2geobau:${av2geobauVersion}") {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
    implementation "io.github.sogis:ilivalidator-custom-functions:${ilivalidatorCustomFunctionsVersion}"
    implementation "io.github.sogis:ilivalidator-custom-functions-geometries:${ilivalidatorCustomFunctionsGeometriesVersion}"
    implementation "ch.geowerkstatt.ilivalidator.extensions.functions:geow-interlis-functions:${geowCustomFunctionsVersion}"
    implementation "ch.geowerkstatt.ilivalidator.extensions.functions:interlis-functions-ngk-so:${geowNgkFunctionsVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "net.sf.saxon:Saxon-HE:${saxonVersion}"
    implementation "software.amazon.awssdk:s3:${awsSdkVersion}"

    runtimeOnly "org.xerial:sqlite-jdbc:${sqliteJdbcVersion}"
    runtimeOnly "org.postgresql:postgresql:${postgresqlVersion}"
    runtimeOnly "org.duckdb:duckdb_jdbc:${duckdbVersion}"

    testImplementation gradleTestKit()
    testImplementation project(':gretl-test-support')
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testImplementation "org.mockftpserver:MockFtpServer:${mockFtpServerVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testRuntimeOnly "org.xerial:sqlite-jdbc:${sqliteJdbcVersion}"
    testRuntimeOnly "org.duckdb:duckdb_jdbc:${duckdbVersion}"

    integrationTestImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    integrationTestImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    integrationTestImplementation "io.floci:testcontainers-floci:${testcontainersFlociVersion}"
    integrationTestRuntimeOnly "org.postgresql:postgresql:${postgresqlVersion}"
}

gradlePlugin {
    testSourceSets sourceSets.test, sourceSets.integrationTest

    plugins {
        gretlCore {
            id = 'ch.so.agi.gretl'
            implementationClass = 'ch.so.agi.gretl.gradle.GretlPlugin'
            displayName = 'GRETL Core'
            description = 'Core Gradle tasks for GRETL pipelines.'
        }
    }
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs Docker-backed integration tests.'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    useJUnitPlatform()
}

def configureRuntimeImageTest = { String name, String description, SourceSet sourceSet, String... tags ->
    tasks.register(name, Test) {
        group = 'verification'
        description = description
        dependsOn rootProject.tasks.named('buildRuntimeImageForTest')
        testClassesDirs = sourceSet.output.classesDirs
        classpath = sourceSet.runtimeClasspath
        maxParallelForks = 1
        systemProperty 'gretl.test.executionMode', 'RUNTIME_IMAGE'
        systemProperty 'gretl.test.runtimeImage.idFile',
                rootProject.layout.buildDirectory.file('runtime-image/test/image-id.txt').get().asFile.absolutePath
        systemProperty 'gretl.test.runtimeImage.tag',
                rootProject.providers.gradleProperty('gretlRuntimeImageTestTag').orElse(
                        "gretl-next-e2e:${rootProject.version.toString().replaceAll('[^A-Za-z0-9_.-]', '-')}").get()
        systemProperty 'gretl.test.runtimeImage.version', rootProject.version.toString()
        systemProperty 'gretl.test.runtimeImage.gradleVersion', '7.6.4'
        systemProperty 'gretl.test.runtimeImage.javaVersion', '17'
        systemProperty 'gretl.test.runtimeImage.timeoutSeconds',
                rootProject.providers.gradleProperty('gretlRuntimeImageTestTimeoutSeconds').orElse('900').get()
        systemProperty 'gretl.test.runtimeImage.user',
                rootProject.providers.gradleProperty('gretlRuntimeImageUser').orElse('').get()
        useJUnitPlatform { includeTags(*tags) }
    }
}

configureRuntimeImageTest('runtimeImageFunctionalTest',
        'Runs core functional canaries against the built runtime image.', sourceSets.runtimeImageFunctionalTest, 'runtime-image')
configureRuntimeImageTest('runtimeImageFunctionalSmokeTest',
        'Runs the core runtime-image smoke canaries.', sourceSets.runtimeImageFunctionalTest, 'runtime-image-smoke')
configureRuntimeImageTest('runtimeImageIntegrationTest',
        'Runs core Docker-service scenarios through the runtime image.', sourceSets.runtimeImageIntegrationTest, 'runtime-image')
configureRuntimeImageTest('runtimeImageIntegrationSmokeTest',
        'Runs the core runtime-image integration smoke canaries.', sourceSets.runtimeImageIntegrationTest, 'runtime-image-smoke')

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'published-artifact-only'
    }
}

tasks.register('publishedFunctionalTest', Test) {
    group = 'verification'
    description = 'Runs GRETL Core functional tests against plugins resolved from the published-test Maven repository.'

    dependsOn rootProject.tasks.named('preparePublishedTestRepository')

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')

    filter {
        includeTestsMatching 'ch.so.agi.gretl.*FunctionalTest'
    }

    systemProperty 'gretl.test.executionMode', 'PUBLISHED_ARTIFACT'
    systemProperty 'gretl.test.publishedRepository',
            rootProject.layout.buildDirectory.dir('published-test/maven-repo').get().asFile.absolutePath
    systemProperty 'gretl.test.pluginVersion', rootProject.version.toString()
    systemProperty 'gretl.test.testKitDirectory',
            layout.buildDirectory.dir('test-kit/published-functional').get().asFile.absolutePath

    inputs.dir rootProject.layout.buildDirectory.dir('published-test/maven-repo')
    inputs.property 'gretlPluginVersion', rootProject.provider { rootProject.version.toString() }

    useJUnitPlatform()
}

tasks.register('publishedIntegrationTest', Test) {
    group = 'verification'
    description = 'Runs Docker-backed GRETL Core integration tests against plugins resolved from the published-test Maven repository.'

    dependsOn rootProject.tasks.named('preparePublishedTestRepository')

    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('integrationTest')
    shouldRunAfter tasks.named('publishedFunctionalTest')

    systemProperty 'gretl.test.executionMode', 'PUBLISHED_ARTIFACT'
    systemProperty 'gretl.test.publishedRepository',
            rootProject.layout.buildDirectory.dir('published-test/maven-repo').get().asFile.absolutePath
    systemProperty 'gretl.test.pluginVersion', rootProject.version.toString()
    systemProperty 'gretl.test.testKitDirectory',
            layout.buildDirectory.dir('test-kit/published-integration').get().asFile.absolutePath

    inputs.dir rootProject.layout.buildDirectory.dir('published-test/maven-repo')
    inputs.property 'gretlPluginVersion', rootProject.provider { rootProject.version.toString() }

    useJUnitPlatform()
}

def geoToolsGuardedConfigurationNames = [
        'compileClasspath',
        'runtimeClasspath',
        'testCompileClasspath',
        'testRuntimeClasspath',
        'integrationTestCompileClasspath',
        'integrationTestRuntimeClasspath'
]

tasks.register('assertNoGeoToolsDependencies') {
    group = 'verification'
    description = 'Fails if any gretl-core classpath resolves GeoTools modules.'

    doLast {
        Map<String, List<String>> blockedModulesByConfiguration = [:]

        geoToolsGuardedConfigurationNames.each { configurationName ->
            def blockedModules = configurations.getByName(configurationName)
                    .incoming
                    .resolutionResult
                    .allComponents
                    .collect { it.id }
                    .findAll { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                    .findAll { it.group == 'org.geotools' || it.group.startsWith('org.geotools.') }
                    .collect { "${it.group}:${it.module}:${it.version}" }
                    .unique()
                    .sort()

            if (!blockedModules.isEmpty()) {
                blockedModulesByConfiguration[configurationName] = blockedModules
            }
        }

        if (!blockedModulesByConfiguration.isEmpty()) {
            def details = blockedModulesByConfiguration.collect { configurationName, blockedModules ->
                "${configurationName}: ${blockedModules.join(', ')}"
            }.join(System.lineSeparator())

            throw new GradleException(
                    "gretl-core must not resolve GeoTools dependencies.${System.lineSeparator()}${details}"
            )
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('assertNoGeoToolsDependencies')
}
