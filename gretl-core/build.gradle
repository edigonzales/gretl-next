plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

base {
    archivesName = 'gretl-core'
}

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    compileOnly project(':gretl-doclet')

    implementation "commons-io:commons-io:${commonsIoVersion}"
    implementation "ch.ehi:ehisqlgen:${ehiSqlgenVersion}"
    implementation "ch.interlis:ili2c-core:${ili2cCoreVersion}"
    implementation "ch.interlis:ili2c-tool:${ili2cToolVersion}"
    implementation "ch.interlis:ili2duckdb:${ili2duckdbVersion}"
    implementation "ch.interlis:ilivalidator:${ilivalidatorVersion}"
    implementation "ch.interlis:iox-ili:${ioxIliVersion}"
    implementation("ch.interlis:iox-wkf:${ioxWkfVersion}") {
        // This slice only uses the lightweight CSV/WKF classes. The GeoTools EPSG
        // database runtime is unnecessary here and pulls an awkward HSQLDB variant
        // into the plugin-under-test classpath.
        exclude group: 'org.geotools', module: 'gt-epsg-hsql'
    }
    implementation "io.github.sogis:ilivalidator-custom-functions:${ilivalidatorCustomFunctionsVersion}"
    implementation "io.github.sogis:ilivalidator-custom-functions-geometries:${ilivalidatorCustomFunctionsGeometriesVersion}"
    implementation "ch.geowerkstatt.ilivalidator.extensions.functions:geow-interlis-functions:${geowCustomFunctionsVersion}"
    implementation "ch.geowerkstatt.ilivalidator.extensions.functions:interlis-functions-ngk-so:${geowNgkFunctionsVersion}"
    implementation "net.sf.saxon:Saxon-HE:${saxonVersion}"

    runtimeOnly "org.xerial:sqlite-jdbc:${sqliteJdbcVersion}"
    runtimeOnly "org.postgresql:postgresql:${postgresqlVersion}"
    runtimeOnly "org.duckdb:duckdb_jdbc:${duckdbVersion}"

    testImplementation gradleTestKit()
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testRuntimeOnly "org.xerial:sqlite-jdbc:${sqliteJdbcVersion}"
    testRuntimeOnly "org.duckdb:duckdb_jdbc:${duckdbVersion}"

    integrationTestImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    integrationTestImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    integrationTestRuntimeOnly "org.postgresql:postgresql:${postgresqlVersion}"
}

gradlePlugin {
    testSourceSets sourceSets.test, sourceSets.integrationTest

    plugins {
        gretlCore {
            id = 'ch.so.agi.gretl'
            implementationClass = 'ch.so.agi.gretl.gradle.GretlPlugin'
            displayName = 'GRETL Core'
            description = 'Core Gradle tasks for GRETL pipelines.'
        }
    }
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs Docker-backed integration tests.'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    useJUnitPlatform()
}
