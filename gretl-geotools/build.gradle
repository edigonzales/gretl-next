plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

base {
    archivesName = 'gretl-geotools'
}

sourceSets {
    worker {
        java.srcDir 'src/worker/java'
        resources.srcDir 'src/worker/resources'
    }
    runtimeImageFunctionalTest {
        resources.srcDir sourceSets.test.resources
        compileClasspath += sourceSets.test.output + sourceSets.main.output
        runtimeClasspath += sourceSets.test.runtimeClasspath + output + compileClasspath
    }
}

configurations {
    workerImplementation {
        canBeConsumed = false
        canBeResolved = false
    }
    workerRuntimeOnly {
        canBeConsumed = false
        canBeResolved = false
    }
    runtimeImageFunctionalTestImplementation.extendsFrom testImplementation
    runtimeImageFunctionalTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    compileOnly project(':gretl-doclet')

    testImplementation sourceSets.worker.output
    testImplementation configurations.workerRuntimeClasspath
    testImplementation gradleTestKit()
    testImplementation project(':gretl-test-support')
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"

    workerImplementation "org.geotools:gt-main:${geotoolsVersion}"
    workerImplementation "org.geotools:gt-geotiff:${geotoolsVersion}"
    workerImplementation "org.geotools:gt-coverage:${geotoolsVersion}"
    workerImplementation "org.geotools:gt-arcgrid:${geotoolsVersion}"
    workerImplementation "org.geotools:gt-shapefile:${geotoolsVersion}"
    workerImplementation "org.geotools:gt-process-raster:${geotoolsVersion}"
    workerImplementation "org.geotools:gt-geopkg:${geotoolsVersion}"
    workerRuntimeOnly "org.geotools:gt-epsg-hsql:${geotoolsVersion}"
}

tasks.register('workerRuntimeJar', Jar) {
    archiveClassifier = 'worker-runtime'
    from sourceSets.worker.output
}

tasks.named('processResources') {
    dependsOn tasks.named('workerRuntimeJar')
    from(tasks.named('workerRuntimeJar')) {
        into 'gretl-geotools-worker-classpath'
    }
    from(configurations.workerRuntimeClasspath) {
        into 'gretl-geotools-worker-classpath/lib'
    }
}

gradlePlugin {
    plugins {
        gretlGeotools {
            id = 'ch.so.agi.gretl.geotools'
            implementationClass = 'ch.so.agi.gretl.geotools.GretlGeotoolsPlugin'
            displayName = 'GRETL GeoTools'
            description = 'GeoTools Gradle tasks for GRETL pipelines using classloader-isolated workers.'
        }
    }
}

tasks.register('publishedFunctionalTest', Test) {
    group = 'verification'
    description = 'Runs GeoTools plugin functional tests against the published plugin artifact.'

    dependsOn rootProject.tasks.named('preparePublishedTestRepository')

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')

    filter {
        includeTestsMatching 'ch.so.agi.gretl.geotools.GeoToolsPluginFunctionalTest'
    }

    systemProperty 'gretl.test.executionMode', 'PUBLISHED_ARTIFACT'
    systemProperty 'gretl.test.publishedRepository',
            rootProject.layout.buildDirectory.dir('published-test/maven-repo').get().asFile.absolutePath
    systemProperty 'gretl.test.pluginVersion', rootProject.version.toString()
    systemProperty 'gretl.test.testKitDirectory',
            layout.buildDirectory.dir('test-kit/published-functional').get().asFile.absolutePath

    inputs.dir rootProject.layout.buildDirectory.dir('published-test/maven-repo')
    inputs.property 'gretlPluginVersion', rootProject.provider { rootProject.version.toString() }

    useJUnitPlatform()
}

def configureRuntimeImageTest = { String name, String description, String tag ->
    tasks.register(name, Test) {
        group = 'verification'
        description = description
        dependsOn rootProject.tasks.named('buildRuntimeImageForTest')
        testClassesDirs = sourceSets.runtimeImageFunctionalTest.output.classesDirs
        classpath = sourceSets.runtimeImageFunctionalTest.runtimeClasspath
        maxParallelForks = 1
        systemProperty 'gretl.test.executionMode', 'RUNTIME_IMAGE'
        systemProperty 'gretl.test.runtimeImage.idFile',
                rootProject.layout.buildDirectory.file('runtime-image/test/image-id.txt').get().asFile.absolutePath
        systemProperty 'gretl.test.runtimeImage.tag',
                rootProject.providers.gradleProperty('gretlRuntimeImageTestTag').orElse(
                        "gretl-next-e2e:${rootProject.version.toString().replaceAll('[^A-Za-z0-9_.-]', '-')}").get()
        systemProperty 'gretl.test.runtimeImage.version', rootProject.version.toString()
        systemProperty 'gretl.test.runtimeImage.gradleVersion', '7.6.4'
        systemProperty 'gretl.test.runtimeImage.javaVersion', '17'
        systemProperty 'gretl.test.runtimeImage.timeoutSeconds',
                rootProject.providers.gradleProperty('gretlRuntimeImageTestTimeoutSeconds').orElse('900').get()
        systemProperty 'gretl.test.runtimeImage.user',
                rootProject.providers.gradleProperty('gretlRuntimeImageUser').orElse('').get()
        useJUnitPlatform { includeTags tag }
    }
}

configureRuntimeImageTest('runtimeImageFunctionalTest',
        'Runs GeoTools functional tests against the built runtime image.', 'runtime-image')
configureRuntimeImageTest('runtimeImageFunctionalSmokeTest',
        'Runs the GeoTools runtime-image smoke canaries.', 'runtime-image-smoke')
