jobs:
  - id: duckdb-postgis-analysis
    name: DuckDB PostGIS analysis
    projectDir: docs/examples/duckdb-sql-executor/postgis-gpkg
    tasks: [analyse]
    enabled: false
    cron: "0 0 2 * * ?"
    timezone: Europe/Zurich
    overlapPolicy: SKIP
    timeout: PT30M
    workerLabels: [geo]
    jvm:
      maxHeap: 1g
      args: ["-Dorg.gradle.jvmargs=-Xmx1g"]
    parameters: []
    secretRefs: []
    triggers: []
    notifications: []
