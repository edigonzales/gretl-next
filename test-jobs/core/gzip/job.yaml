schemaVersion: 2
id: core-gzip
description: Compresses a text file with the core Gzip task.
category: core
builds:
  - id: groovy
    file: build.gradle
entryTasks:
  - compressFile
expectedTasks:
  - path: :compressFile
    className: ch.so.agi.gretl.tasks.Gzip
executionTargets:
  pluginClasspath: required
  publishedArtifact: required
  runtimeImageOneShot: required
  runtimeImageService: required
capabilities:
  - filesystem
fixtures: []
assertions: core-gzip
timeoutSeconds: 300
