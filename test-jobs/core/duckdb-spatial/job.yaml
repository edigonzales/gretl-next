schemaVersion: 2
id: core-duckdb-spatial
description: Loads the bundled DuckDB spatial extension and writes two point rows.
category: core
builds:
  - id: groovy
    file: build.gradle
entryTasks:
  - executeSpatialSql
expectedTasks:
  - path: :executeSpatialSql
    className: ch.so.agi.gretl.tasks.DuckDbSqlExecutor
executionTargets:
  pluginClasspath: required
  publishedArtifact: required
  runtimeImageOneShot: required
  runtimeImageService: required
capabilities:
  - duckdb
  - duckdb-spatial
fixtures:
  - id: duckdbExtensions
    type: duckdb_extensions
    bindings:
      - source: extensionDirectory
        target: environment-variable
        name: DUCKDB_EXTENSION_DIRECTORY
assertions: core-duckdb-spatial
timeoutSeconds: 600
