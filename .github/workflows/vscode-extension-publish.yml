name: VS Code extension publish

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional source commit SHA to package
        required: false
        type: string
      source_run_number:
        description: Optional CI run number used as the publish patch version
        required: false
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
      source_run_number: ${{ steps.gate.outputs.source_run_number }}
    steps:
      - id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            SUCCESS="${{ github.event.workflow_run.conclusion }}"
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            if [[ "$SUCCESS" != "success" ]]; then
              echo "CI run did not succeed ($SUCCESS). Skipping publish." >&2
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$BRANCH" != "main" && "$BRANCH" != "master" ]]; then
              echo "Not a push to main/master ($BRANCH). Skipping publish." >&2
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "source_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "source_run_number=${{ github.event.workflow_run.run_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            SHA="${{ inputs.source_sha || github.sha }}"
            echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"
            RUN="${{ inputs.source_run_number || github.run_number }}"
            echo "source_run_number=$RUN" >> "$GITHUB_OUTPUT"
          fi

  build-fat-jar:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build LSP fat JAR
        run: ./gradlew :gretl-lsp:test :gretl-lsp:shadowJar

      - name: Stage LSP JAR
        shell: bash
        run: |
          mkdir -p build/publish
          cp gretl-lsp/build/libs/gretl-lsp-all.jar build/publish/gretl-lsp-all.jar

      - name: Upload LSP JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: gretl-lsp-jar
          path: build/publish/gretl-lsp-all.jar

  build-runtimes:
    needs: [gate, build-fat-jar]
    if: needs.gate.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform_id: linux-x64
            shell: bash
          - runner: ubuntu-24.04-arm
            platform_id: linux-arm64
            shell: bash
          - runner: macos-15
            platform_id: darwin-arm64
            shell: bash
          - runner: windows-2022
            platform_id: win32-x64
            shell: pwsh
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download LSP JAR
        uses: actions/download-artifact@v4
        with:
          name: gretl-lsp-jar
          path: dist

      - name: Build runtime bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          JAR=$(ls dist/*.jar | head -n1)
          MODS=$(jdeps --print-module-deps --ignore-missing-deps --multi-release 17 "$JAR")
          jlink --add-modules "$MODS" --no-header-files --no-man-pages --strip-debug --compress=2 --output runtime

      - name: Build runtime bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $JAR = Get-ChildItem dist/*.jar | Select-Object -First 1
          Write-Host "Creating jdeps from $JAR"
          $JDK_MODS = & jdeps --print-module-deps --ignore-missing-deps --multi-release 17 $JAR.FullName
          jlink --add-modules $JDK_MODS --no-header-files --no-man-pages --strip-debug --compress=2 --output runtime

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: jre-runtime-${{ matrix.platform_id }}
          path: runtime/

  package-and-publish:
    needs: [gate, build-fat-jar, build-runtimes]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      EXTENSION_NAME: gretl-vscode
      PUBLISHER: edigonzales
      SOURCE_RUN_NUMBER: ${{ needs.gate.outputs.source_run_number }}
      VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
      OPEN_VSIX_MARKETPLACE_TOKEN: ${{ secrets.OPEN_VSIX_MARKETPLACE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download LSP JAR
        uses: actions/download-artifact@v4
        with:
          name: gretl-lsp-jar
          path: vscode/gretl-vscode/server/

      - name: Download runtime bundles
        uses: actions/download-artifact@v4
        with:
          pattern: jre-runtime-*
          path: tmp/runtimes
          merge-multiple: false

      - name: Stage runtime bundles
        shell: bash
        run: |
          set -euo pipefail
          EXT_DIR=vscode/gretl-vscode/server/jre
          for runtime_dir in tmp/runtimes/jre-runtime-*/; do
            platform=$(basename "$runtime_dir" | sed 's/^jre-runtime-//')
            target="$EXT_DIR/$platform"
            mkdir -p "$(dirname "$target")"
            cp -a "$runtime_dir" "$target"

            if [[ "$platform" != win32-* ]]; then
              chmod +x "$target/bin/java" 2>/dev/null || true
            fi

            echo "Staged runtime: $platform"
            ls -la "$target/bin/" || echo "no bin dir for $platform"
          done

          expected_platforms=("darwin-arm64" "linux-arm64" "linux-x64" "win32-x64")
          for platform in "${expected_platforms[@]}"; do
            if [[ ! -d "$EXT_DIR/$platform" ]]; then
              echo "Missing expected runtime: $platform" >&2
              exit 1
            fi
          done

      - name: Install extension dependencies
        shell: bash
        working-directory: vscode/gretl-vscode
        run: npm ci

      - name: Run extension tests
        shell: bash
        working-directory: vscode/gretl-vscode
        run: npm test

      - name: Set CI publish version
        shell: bash
        working-directory: vscode/gretl-vscode
        run: |
          version=$(node ./scripts/set-ci-version.js "$SOURCE_RUN_NUMBER")
          echo "PUBLISH_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and package VSIX
        shell: bash
        working-directory: vscode/gretl-vscode
        run: |
          npm run package:vsix
          npm run check:vsix

      - name: Detect published versions
        shell: bash
        working-directory: vscode/gretl-vscode
        run: |
          state=$(node ./scripts/registry-state.js "$PUBLISHER" "$EXTENSION_NAME" "$PUBLISH_VERSION")
          echo "REGISTRY_STATE=$state" >> "$GITHUB_ENV"
          echo "Registry state: $state"

      - name: Upload packaged VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: gretl-vscode-${{ env.PUBLISH_VERSION }}
          path: vscode/gretl-vscode/gretl-vscode.vsix

      - name: Publish to Visual Studio Marketplace
        shell: bash
        working-directory: vscode/gretl-vscode
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          PUBLISHED=$(echo "$REGISTRY_STATE" | jq -r '.marketplace // false')
          if [[ "$PUBLISHED" == "true" ]]; then
            echo "Version $PUBLISH_VERSION already published to VS Marketplace. Skipping."
          else
            npm run publish:vsmarketplace
          fi

      - name: Publish to Open VSX
        shell: bash
        working-directory: vscode/gretl-vscode
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSIX_MARKETPLACE_TOKEN }}
        run: |
          PUBLISHED=$(echo "$REGISTRY_STATE" | jq -r '.openvsx // false')
          if [[ "$PUBLISHED" == "true" ]]; then
            echo "Version $PUBLISH_VERSION already published to Open VSX. Skipping."
          else
            npx ovsx publish gretl-vscode.vsix -p "$OVSX_PAT"
          fi
