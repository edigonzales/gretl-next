name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'website/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'website/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and unit test
        run: ./gradlew clean check

      - name: Run integration tests from source classpath
        run: ./gradlew :gretl-core:integrationTest

      - name: Test published GRETL plugin artifacts
        run: ./gradlew publishedArtifactTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            gretl-core/build/reports/tests/
            gretl-core/build/test-results/

      - name: Upload published-test repository on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: published-test-repository-on-failure
          path: build/published-test/maven-repo

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish snapshots
        env:
          GRETL_PUBLISH_USERNAME: ${{ secrets.MAVEN_REPO_USER }}
          GRETL_PUBLISH_PASSWORD: ${{ secrets.MAVEN_REPO_PASSWORD }}
        run: ./gradlew publishSnapshots
