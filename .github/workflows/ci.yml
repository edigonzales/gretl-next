name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'website/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'website/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and unit test
        run: ./gradlew clean check

      - name: Run Docker-backed source integration gate
        run: ./gradlew sourceIntegrationTest --stacktrace

      - name: Test published GRETL plugin artifacts
        run: ./gradlew publishedArtifactTest --stacktrace

      - name: Show Docker environment
        run: |
          docker version
          docker info

      - name: Complete runtime image gate
        run: ./gradlew runtimeImageTest --stacktrace

      - name: Verify canonical task coverage
        run: ./gradlew :gretl-job-tests:coverageTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            build/reports/test-jobs/**

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            gretl-core/build/reports/tests/
            gretl-core/build/test-results/

      - name: Upload runtime image diagnostics and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-test-reports
          path: |
            build/runtime-image/dependency-closure-test/**
            build/runtime-image/dependency-closure/**
            **/build/reports/tests/runtimeImage*/**
            **/build/test-results/runtimeImage*/**

      - name: Upload published-test repository on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: published-test-repository-on-failure
          path: build/published-test/maven-repo

      - name: Upload canonical materialized jobs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-materialized-jobs
          path: gretl-job-tests/build/materialized-jobs/


  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish snapshots
        env:
          GRETL_PUBLISH_USERNAME: ${{ secrets.MAVEN_REPO_USER }}
          GRETL_PUBLISH_PASSWORD: ${{ secrets.MAVEN_REPO_PASSWORD }}
        run: ./gradlew publishSnapshots
