name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'website/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'website/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and unit test
        run: ./gradlew clean check

      - name: Run integration tests from source classpath
        run: ./gradlew :gretl-core:integrationTest

      - name: Test published GRETL plugin artifacts
        run: ./gradlew publishedArtifactTest --stacktrace

      - name: Run combined Core and GeoTools P0 gate
        run: ./gradlew coreGeoToolsCombinedTest --stacktrace

      - name: Show Docker environment
        run: |
          docker version
          docker info

      - name: Build and test offline GRETL runtime image
        run: ./gradlew runtimeImageOfflineTest --stacktrace

      - name: Runtime image contract
        run: ./gradlew runtimeImageContractTest --stacktrace

      - name: Runtime image service and daemon gate
        run: ./gradlew runtimeImageServiceTest --stacktrace

      - name: Runtime image smoke gate
        run: ./gradlew runtimeImageSmokeTest --stacktrace

      - name: Runtime image full E2E gate
        run: ./gradlew runtimeImageE2eTest --stacktrace

      - name: Complete runtime image gate
        run: ./gradlew runtimeImageTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            gretl-combined-tests/build/reports/tests/
            gretl-combined-tests/build/test-results/

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            gretl-core/build/reports/tests/
            gretl-core/build/test-results/

      - name: Upload runtime image diagnostics and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-test-reports
          path: |
            build/runtime-image/offline-test/**
            **/build/reports/tests/runtimeImage*/**
            **/build/test-results/runtimeImage*/**

      - name: Upload published-test repository on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: published-test-repository-on-failure
          path: build/published-test/maven-repo

      - name: Upload combined TestKit diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: combined-testkit-diagnostics
          path: |
            gretl-combined-tests/build/test-kit/
            gretl-combined-tests/build/combined-plugin-classpath/

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish snapshots
        env:
          GRETL_PUBLISH_USERNAME: ${{ secrets.MAVEN_REPO_USER }}
          GRETL_PUBLISH_PASSWORD: ${{ secrets.MAVEN_REPO_PASSWORD }}
        run: ./gradlew publishSnapshots
