name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/reference/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/reference/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  THOTH_BIBLIOS_VERSION: 0.0.1-SNAPSHOT
  THOTH_BIBLIOS_REPOSITORY: https://jars.interlis.guru/snapshots

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GRETL next
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Download latest Thoth Biblios snapshot
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${THOTH_BIBLIOS_REPOSITORY}/guru/interlis/thoth-biblios/${THOTH_BIBLIOS_VERSION}"
          mkdir -p build

          curl --fail --silent --show-error --location \
            "${BASE_URL}/maven-metadata.xml" \
            --output build/thoth-biblios-maven-metadata.xml

          SNAPSHOT_VALUE="$(python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          metadata = ET.parse('build/thoth-biblios-maven-metadata.xml').getroot()

          candidates = []
          for snapshot in metadata.findall('./versioning/snapshotVersions/snapshotVersion'):
              extension = (snapshot.findtext('extension') or '').strip()
              classifier = (snapshot.findtext('classifier') or '').strip()
              value = (snapshot.findtext('value') or '').strip()
              updated = (snapshot.findtext('updated') or '').strip()
              if extension == 'jar' and classifier == 'all' and value:
                  candidates.append((updated, value))

          if candidates:
              print(max(candidates)[1])
              raise SystemExit(0)

          version = os.environ['THOTH_BIBLIOS_VERSION']
          timestamp = (metadata.findtext('./versioning/snapshot/timestamp') or '').strip()
          build_number = (metadata.findtext('./versioning/snapshot/buildNumber') or '').strip()
          if not timestamp or not build_number or not version.endswith('-SNAPSHOT'):
              raise SystemExit('Could not resolve latest Thoth Biblios all-JAR snapshot from Maven metadata')

          print(f"{version[:-len('-SNAPSHOT')]}-{timestamp}-{build_number}")
          PY
          )"

          echo "Resolved Thoth Biblios snapshot: ${SNAPSHOT_VALUE}"

          curl --fail --silent --show-error --location \
            "${BASE_URL}/thoth-biblios-${SNAPSHOT_VALUE}-all.jar" \
            --output build/thoth-biblios.jar

          test -s build/thoth-biblios.jar

      - name: Render Quarto website
        run: quarto render website

      - name: Prepare Biblios config for tested checkout
        shell: bash
        run: |
          set -euo pipefail

          # Pull request checkouts are detached. Point a local main branch at the
          # exact checkout so Biblios renders the commit being tested while the
          # published version remains named "main".
          if [ "$(git branch --show-current)" != "main" ]; then
            git branch --force main HEAD
          fi

          mkdir -p build
          sed \
            -e "s#url: https://github.com/edigonzales/gretl-next.git#url: file://${GITHUB_WORKSPACE}#" \
            docs/reference/biblios.yml > build/biblios-pages.yml

      - name: Render Biblios reference into Quarto output
        shell: bash
        run: |
          set -euo pipefail

          java -jar build/thoth-biblios.jar build \
            --config build/biblios-pages.yml \
            --output website/_site/reference \
            --clean

      - name: Verify assembled site
        run: |
          test -f website/_site/index.html
          test -f website/_site/reference/index.html

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
