tasks.register('verifyTaskDocs') {
    group = 'verification'
    description = 'Verifies that checked-in task documentation matches the current GRETL DSL.'
    dependsOn tasks.named('generateTaskDocsVerification')

    doLast {
        File checkedInDirectory = layout.projectDirectory.dir('docs/reference/generated').asFile
        File verificationDirectory = taskDocsVerificationDirectory.get().asFile

        def readGeneratedFiles = { File directory ->
            fileTree(directory).matching { include '**/*.adoc' }.files.collectEntries { File generatedFile ->
                String relativePath = directory.toPath().relativize(generatedFile.toPath()).toString()
                [(relativePath): generatedFile.getText('UTF-8')]
            }
        }

        Map<String, String> checkedInFiles = readGeneratedFiles(checkedInDirectory)
        Map<String, String> verificationFiles = readGeneratedFiles(verificationDirectory)
        Set<String> allFiles = new TreeSet<>(checkedInFiles.keySet())
        allFiles.addAll(verificationFiles.keySet())
        List<String> differences = allFiles.findAll { String path ->
            checkedInFiles[path] != verificationFiles[path]
        }.toList()

        if (!differences.isEmpty()) {
            throw new GradleException(
                    "Checked-in task documentation is stale. Run './gradlew generateTaskDocs' and commit the result. " +
                            "Differences: " + differences.join(', '))
        }

        File masterFile = layout.projectDirectory.file('docs/reference/reference.adoc').asFile
        String masterContent = masterFile.getText('UTF-8')
        List<String> missingIncludes = verificationFiles.keySet()
                .findAll { String path -> path.startsWith('task-') && path != 'task-reference.adoc' }
                .findAll { String path -> !masterContent.contains("include::generated/${path}[]") }
                .sort()
                .toList()
        if (!missingIncludes.isEmpty()) {
            throw new GradleException(
                    "The hand-maintained reference is missing generated task includes: " +
                            missingIncludes.join(', '))
        }
    }
}

def referenceStyleRoles = [
        'product',
        'acronym',
        'task-type',
        'task-name',
        'dsl-method',
        'dsl-signature',
        'java-type',
        'parameter',
        'file-name',
        'file-ext',
        'path',
        'glob',
        'command',
        'cli-option',
        'config-key',
        'env-var',
        'literal',
        'domain-id',
        'placeholder',
        'code-fragment',
        'required',
        'optional'
] as Set

tasks.register('verifyReferenceStyle') {
    group = 'verification'
    description = 'Verifies semantic typography in the hand-maintained GRETL reference.'

    inputs.file(layout.projectDirectory.file('docs/reference/reference.adoc'))

    doLast {
        File referenceFile = layout.projectDirectory.file('docs/reference/reference.adoc').asFile
        List<String> violations = []
        boolean sourceBlockPending = false
        boolean inSourceBlock = false

        referenceFile.readLines('UTF-8').eachWithIndex { String line, int index ->
            int lineNumber = index + 1
            String trimmed = line.trim()

            if (!inSourceBlock && trimmed ==~ /\[source(?:,[^\]]*)?\]/) {
                sourceBlockPending = true
            } else if (trimmed == '----' && sourceBlockPending) {
                inSourceBlock = true
                sourceBlockPending = false
                return
            } else if (trimmed == '----' && inSourceBlock) {
                inSourceBlock = false
                return
            }

            if (inSourceBlock) {
                return
            }

            if (line =~ /(?<!\\)\+[^+\n]+\+/) {
                violations.add("${referenceFile}:${lineNumber}: '+...+' is not allowed; use backticks and a semantic role")
            }

            def roleMatcher = line =~ /\[\.([A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+)*)\]/
            roleMatcher.each { match ->
                match[1].split(/\./).each { String role ->
                    if (!referenceStyleRoles.contains(role)) {
                        violations.add("${referenceFile}:${lineNumber}: undocumented semantic role '${role}'")
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Reference style violations:\n" + violations.join('\n'))
        }
    }
}

