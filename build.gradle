plugins {
    id 'base'
    id 'org.springframework.boot' version '3.5.14' apply false
}

group = 'ch.so.agi'
version = '5.0.0-SNAPSHOT'

def publishUsername = providers.gradleProperty('gretlPublishUsername')
        .orElse(providers.environmentVariable('GRETL_PUBLISH_USERNAME'))
def publishPassword = providers.gradleProperty('gretlPublishPassword')
        .orElse(providers.environmentVariable('GRETL_PUBLISH_PASSWORD'))

ext {
    commonsIoVersion = '2.6'
    commonsNetVersion = '3.6'
    ehiSqlgenVersion = '1.16.3'
    ili2pgVersion = '5.5.1'
    ili2gpkgVersion = '5.5.1'
    ili2duckdbVersion = '5.5.1'
    ioxIliVersion = '1.24.4'
    ilivalidatorVersion = '1.15.0'
    ilivalidatorCustomFunctionsVersion = '1.1.50'
    ilivalidatorCustomFunctionsGeometriesVersion = '0.0.8'
    geowCustomFunctionsVersion = '0.2.1'
    geowNgkFunctionsVersion = '1.0.3'
    geotoolsVersion = '34.2'
    ili2cCoreVersion = '5.6.8'
    ili2cToolVersion = '5.6.8'
    ioxWkfVersion = '2.0.1-SNAPSHOT'
    ioxFormatsVersion = '1.0.3'
    av2chVersion = '1.1.8'
    av2geobauVersion = '1.4.2'
    jacksonVersion = '2.17.2'
    junitVersion = '5.10.3'
    saxonVersion = '11.4'
    sqliteJdbcVersion = '3.43.0.0'
    postgresqlVersion = '42.6.0'
    duckdbVersion = '1.5.2.0'
    awsSdkVersion = '2.15.64'
    mockFtpServerVersion = '2.7.1'
    testcontainersVersion = '1.21.4'
    testcontainersFlociVersion = '1.10.0'
    springBootVersion = '3.5.14'
    quartzVersion = '2.3.2'
}

subprojects {
    group = rootProject.group
    version = rootProject.version

    configurations.configureEach {
        exclude group: 'xml-apis', module: 'xml-apis'
        exclude group: 'xml-apis', module: 'xml-apis-ext'
        // Keep one DuckDB JDBC baseline across the modular plugin classpath,
        // including ili2duckdb 5.5.1 and the native DuckDbSqlExecutor tasks.
        resolutionStrategy.force("org.duckdb:duckdb_jdbc:${duckdbVersion}")
    }

    plugins.withId('maven-publish') {
        publishing {
            repositories {
                maven {
                    name = 'runtimeImage'
                    url = rootProject.layout.buildDirectory.dir('runtime-image/maven-repo').get().asFile.toURI()
                }
                maven {
                    name = 'interlisGuruSnapshots'
                    url = uri('https://jars.interlis.guru/snapshots')
                    credentials {
                        username = publishUsername.orNull
                        password = publishPassword.orNull
                    }
                }
            }
        }
    }

    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(17)
            }
            withSourcesJar()
            withJavadocJar()
        }

        tasks.withType(JavaCompile).configureEach {
            options.release = 17
            options.encoding = 'UTF-8'
        }

        tasks.withType(Javadoc).configureEach {
            options.addBooleanOption('Xdoclint:none', true)
            options.quiet()
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }
    }
}

def runtimeImageDir = layout.buildDirectory.dir('runtime-image/docker')
def runtimeImageRepoDir = layout.buildDirectory.dir('runtime-image/maven-repo')
def dockerImageName = providers.gradleProperty('gretlDockerImage').orElse('sogis/gretl-modular:test')
def externalRuntimeClasspath = { String projectPath ->
    File gradleLibDir = gradle.gradleHomeDir == null ? null : new File(gradle.gradleHomeDir, 'lib').canonicalFile
    project(projectPath).configurations.runtimeClasspath.files.findAll { File file ->
        !file.name.startsWith('gradle-api-') &&
                (gradleLibDir == null || !file.canonicalPath.startsWith(gradleLibDir.canonicalPath + File.separator))
    }
}

tasks.register('cleanRuntimeImageRepository', Delete) {
    delete runtimeImageRepoDir
}

tasks.register('publishSnapshots') {
    group = 'publishing'
    description = 'Publishes all GRETL snapshot publications to the interlisGuruSnapshots repository.'
}

subprojects {
    plugins.withId('maven-publish') {
        tasks.matching { it.name.endsWith('ToRuntimeImageRepository') }.configureEach {
            dependsOn rootProject.tasks.named('cleanRuntimeImageRepository')
        }

        rootProject.tasks.named('publishSnapshots').configure {
            dependsOn tasks.named('publishAllPublicationsToInterlisGuruSnapshotsRepository')
        }
    }
}

tasks.register('stageRuntimeImage', Sync) {
    group = 'distribution'
    description = 'Stages the Docker runtime image context with plugin Maven publications and runtime jars.'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    dependsOn ':gretl-core:publishAllPublicationsToRuntimeImageRepository'
    dependsOn ':gretl-geotools:publishAllPublicationsToRuntimeImageRepository'
    dependsOn ':gretl-core:jar'
    dependsOn ':gretl-geotools:jar'

    into runtimeImageDir

    from('docker') {
        include 'Dockerfile'
        include 'gretl'
        include 'init.gradle'
    }
    from(runtimeImageRepoDir) {
        into 'maven-repo'
        exclude '**/*-sources.jar*'
        exclude '**/*-javadoc.jar*'
    }
    from({
        [
                project(':gretl-core').tasks.named('jar').get().archiveFile.get().asFile,
                project(':gretl-geotools').tasks.named('jar').get().archiveFile.get().asFile
        ]
    }) {
        into 'libs'
    }
    from({ externalRuntimeClasspath(':gretl-core') }) {
        into 'libs'
    }
    from({ externalRuntimeClasspath(':gretl-geotools') }) {
        into 'libs'
    }

    doLast {
        file("${destinationDir}/build.info").text = """GRETL Modular ${project.version}
Gradle ${gradle.gradleVersion}
Java 17
"""
    }
}

tasks.register('buildRuntimeImage', Exec) {
    group = 'distribution'
    description = 'Builds the local Docker runtime image. Override with -PgretlDockerImage=name:tag.'
    dependsOn tasks.named('stageRuntimeImage')
    workingDir runtimeImageDir.get().asFile
    commandLine 'docker', 'build', '-t', dockerImageName.get(), '.'
}

tasks.register('checkAgentSkillMetadata', Exec) {
    group = 'verification'
    description = 'Validates GRETL skill frontmatter and placeholder-free content.'
    commandLine './scripts/check-agent-skills.sh'
}

tasks.register('checkAgentSkillAdapters', Exec) {
    group = 'verification'
    description = 'Validates GRETL skill adapters and OpenCode command targets.'
    commandLine './scripts/check-agent-skill-adapters.sh'
}

tasks.register('checkAgentSkills') {
    group = 'verification'
    description = 'Validates cross-agent GRETL skill metadata and adapters.'
    dependsOn tasks.named('checkAgentSkillMetadata')
    dependsOn tasks.named('checkAgentSkillAdapters')
}

tasks.register('copyDevGretlServerJar', Copy) {
    group = 'gretl-lsp'
    description = 'Copies the GRETL LSP fat JAR into the VS Code extension server directory.'
    dependsOn ':gretl-lsp:shadowJar'
    from project(':gretl-lsp').tasks.named('shadowJar').map { it.archiveFile }
    into layout.projectDirectory.dir('vscode/gretl-vscode/server')
    rename { 'gretl-lsp-all.jar' }
}

tasks.named('check') {
    dependsOn tasks.named('checkAgentSkills')
}

tasks.register('generateTaskDocs', Javadoc) {
    group = 'documentation'
    description = 'Generates AsciiDoc task reference files from GRETL task DSL annotations.'
    destinationDir = layout.projectDirectory.dir('docs/reference/generated').asFile
    failOnError = true
    options.doclet = 'ch.so.agi.gretl.doclet.GretlDoclet'
    options.addStringOption('docletlocale', 'de_CH')
    options.quiet()
}

def taskDocsVerificationDirectory = layout.buildDirectory.dir('generated-docs/tasks-verification')

tasks.register('generateTaskDocsVerification', Javadoc) {
    group = 'verification'
    description = 'Generates task documentation into a temporary directory for freshness verification.'
    destinationDir = taskDocsVerificationDirectory.get().asFile
    failOnError = true
    options.doclet = 'ch.so.agi.gretl.doclet.GretlDoclet'
    options.addStringOption('docletlocale', 'de_CH')
    options.quiet()
}

tasks.register('verifyTaskDocs') {
    group = 'verification'
    description = 'Verifies that checked-in task documentation matches the current GRETL DSL.'
    dependsOn tasks.named('generateTaskDocsVerification')

    doLast {
        File checkedInDirectory = layout.projectDirectory.dir('docs/reference/generated').asFile
        File verificationDirectory = taskDocsVerificationDirectory.get().asFile

        def readGeneratedFiles = { File directory ->
            fileTree(directory).matching { include '**/*.adoc' }.files.collectEntries { File generatedFile ->
                String relativePath = directory.toPath().relativize(generatedFile.toPath()).toString()
                [(relativePath): generatedFile.getText('UTF-8')]
            }
        }

        Map<String, String> checkedInFiles = readGeneratedFiles(checkedInDirectory)
        Map<String, String> verificationFiles = readGeneratedFiles(verificationDirectory)
        Set<String> allFiles = new TreeSet<>(checkedInFiles.keySet())
        allFiles.addAll(verificationFiles.keySet())
        List<String> differences = allFiles.findAll { String path ->
            checkedInFiles[path] != verificationFiles[path]
        }.toList()

        if (!differences.isEmpty()) {
            throw new GradleException(
                    "Checked-in task documentation is stale. Run './gradlew generateTaskDocs' and commit the result. " +
                            "Differences: " + differences.join(', '))
        }

        File masterFile = layout.projectDirectory.file('docs/reference/reference.adoc').asFile
        String masterContent = masterFile.getText('UTF-8')
        List<String> missingIncludes = verificationFiles.keySet()
                .findAll { String path -> path.startsWith('task-') && path != 'task-reference.adoc' }
                .findAll { String path -> !masterContent.contains("include::generated/${path}[]") }
                .sort()
                .toList()
        if (!missingIncludes.isEmpty()) {
            throw new GradleException(
                    "The hand-maintained reference is missing generated task includes: " +
                            missingIncludes.join(', '))
        }
    }
}

def referenceStyleRoles = [
        'product',
        'acronym',
        'task-type',
        'task-name',
        'dsl-method',
        'dsl-signature',
        'java-type',
        'parameter',
        'file-name',
        'file-ext',
        'path',
        'glob',
        'command',
        'cli-option',
        'config-key',
        'env-var',
        'literal',
        'domain-id',
        'placeholder',
        'code-fragment',
        'required',
        'optional'
] as Set

tasks.register('verifyReferenceStyle') {
    group = 'verification'
    description = 'Verifies semantic typography in the hand-maintained GRETL reference.'

    inputs.file(layout.projectDirectory.file('docs/reference/reference.adoc'))

    doLast {
        File referenceFile = layout.projectDirectory.file('docs/reference/reference.adoc').asFile
        List<String> violations = []
        boolean sourceBlockPending = false
        boolean inSourceBlock = false

        referenceFile.readLines('UTF-8').eachWithIndex { String line, int index ->
            int lineNumber = index + 1
            String trimmed = line.trim()

            if (!inSourceBlock && trimmed ==~ /\[source(?:,[^\]]*)?\]/) {
                sourceBlockPending = true
            } else if (trimmed == '----' && sourceBlockPending) {
                inSourceBlock = true
                sourceBlockPending = false
                return
            } else if (trimmed == '----' && inSourceBlock) {
                inSourceBlock = false
                return
            }

            if (inSourceBlock) {
                return
            }

            if (line =~ /(?<!\\)\+[^+\n]+\+/) {
                violations.add("${referenceFile}:${lineNumber}: '+...+' is not allowed; use backticks and a semantic role")
            }

            def roleMatcher = line =~ /\[\.([A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+)*)\]/
            roleMatcher.each { match ->
                match[1].split(/\./).each { String role ->
                    if (!referenceStyleRoles.contains(role)) {
                        violations.add("${referenceFile}:${lineNumber}: undocumented semantic role '${role}'")
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Reference style violations:\n" + violations.join('\n'))
        }
    }
}

tasks.register('generateLspMetadata', Javadoc) {
    group = 'documentation'
    description = 'Generates GRETL LSP metadata JSON file from task DSL annotations.'
    destinationDir = layout.buildDirectory.dir('generated-docs/lsp').get().asFile
    failOnError = true
    options.doclet = 'ch.so.agi.gretl.doclet.GretlDoclet'
    options.quiet()
}

gradle.projectsEvaluated {
    ['generateTaskDocs', 'generateTaskDocsVerification'].each { taskName ->
        tasks.named(taskName, Javadoc).configure { task ->
            def docletProject = project(':gretl-doclet')
            def coreProject = project(':gretl-core')
            def geotoolsProject = project(':gretl-geotools')

            task.dependsOn docletProject.tasks.named('jar')
            task.dependsOn coreProject.tasks.named('classes')
            task.dependsOn geotoolsProject.tasks.named('classes')

            task.source = files(
                coreProject.fileTree('src/main/java') {
                    include 'ch/so/agi/gretl/tasks/*.java'
                },
                geotoolsProject.fileTree('src/main/java') {
                    include 'ch/so/agi/gretl/geotools/tasks/*.java'
                }
            )
            task.classpath = files(
                coreProject.sourceSets.main.output,
                coreProject.sourceSets.main.compileClasspath,
                geotoolsProject.sourceSets.main.output,
                geotoolsProject.sourceSets.main.compileClasspath
            )
            task.options.docletpath = files(docletProject.tasks.named('jar')).files.toList()
        }
    }

    tasks.named('generateLspMetadata', Javadoc).configure { task ->
        def docletProject = project(':gretl-doclet')
        def coreProject = project(':gretl-core')
        def geotoolsProject = project(':gretl-geotools')

        task.dependsOn docletProject.tasks.named('jar')
        task.dependsOn coreProject.tasks.named('classes')
        task.dependsOn geotoolsProject.tasks.named('classes')

        task.source = files(
                coreProject.fileTree('src/main/java') {
                    include 'ch/so/agi/gretl/tasks/*.java'
                },
                geotoolsProject.fileTree('src/main/java') {
                    include 'ch/so/agi/gretl/geotools/tasks/*.java'
                }
        )
        task.classpath = files(
                coreProject.sourceSets.main.output,
                coreProject.sourceSets.main.compileClasspath,
                geotoolsProject.sourceSets.main.output,
                geotoolsProject.sourceSets.main.compileClasspath
        )
        task.options.docletpath = files(docletProject.tasks.named('jar')).files.toList()
        task.options.addStringOption('lspoutput', docletProject.layout.buildDirectory.dir('generated/gretl-lsp-metadata').get().asFile.absolutePath)
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyTaskDocs')
    dependsOn tasks.named('verifyReferenceStyle')
}
