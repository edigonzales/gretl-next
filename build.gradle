def writeBundledManifests = { File context ->
    File repository = new File(context, 'maven-repo')
    File manifests = new File(context, 'manifests')
    manifests.mkdirs()
    List<File> files = []
    if (repository.isDirectory()) {
        repository.eachFileRecurse { File file -> if (file.isFile()) files.add(file) }
    }
    files.sort { File left, File right ->
        repository.toPath().relativize(left.toPath()).toString() <=>
                repository.toPath().relativize(right.toPath()).toString()
    }
    def relative = { File file -> repository.toPath().relativize(file.toPath()).toString().replace(File.separator, '/') }
    def artifactRole = { String path ->
        if (path.endsWith('.module')) return 'GRADLE_MODULE_METADATA'
        if (path.endsWith('maven-metadata.xml') || path.endsWith('.sha1') || path.endsWith('.md5')) return 'MAVEN_METADATA'
        if (path.endsWith('.pom') && path.split('/').size() >= 3
                && path.split('/')[-3].toString().endsWith('.gradle.plugin')) return 'PLUGIN_MARKER_POM'
        if (path.startsWith('ch/so/agi/gretl-core/') || path.startsWith('ch/so/agi/gretl-geotools/')) {
            return path.endsWith('.pom') ? 'IMPLEMENTATION_POM' : 'IMPLEMENTATION_JAR'
        }
        return path.endsWith('.jar') ? 'RUNTIME_DEPENDENCY' : 'MAVEN_METADATA'
    }
    def artifactCoordinates = { String path ->
        String[] segments = path.split('/')
        if (segments.length < 4) {
            return [group: '', module: '', version: '', classifier: '', extension: '']
        }
        String module = segments[-3]
        String version = segments[-2]
        String filename = segments[-1]
        String extension = filename.contains('.') ? filename.substring(filename.lastIndexOf('.') + 1) : ''
        String stem = extension ? filename.substring(0, filename.length() - extension.length() - 1) : filename
        String prefix = module + '-'
        String remainder = stem.startsWith(prefix) ? stem.substring(prefix.length()) : ''
        String versionPrefix = version + '-'
        if (remainder.startsWith(versionPrefix)) remainder = remainder.substring(versionPrefix.length())
        else if (remainder == version) remainder = ''
        String classifier = remainder
        [group: segments[0..<(segments.length - 3)].join('.'), module: module, version: version,
         classifier: classifier, extension: extension]
    }
    List<Map> records = files.collect { File file ->
        String path = relative(file)
        [group: artifactCoordinates(path).group, module: artifactCoordinates(path).module,
         version: artifactCoordinates(path).version, classifier: artifactCoordinates(path).classifier,
         extension: artifactCoordinates(path).extension, relativePath: path, sha256: sha256File(file),
         size: file.length(), role: artifactRole(path)]
    }
    String version = projectVersionString
    String generatedAt = java.time.Instant.now().toString()
    File manifest = new File(manifests, 'bundled-artifacts.json')
    manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            gretlVersion: version,
            gradleVersion: runtimeImageGradleVersion.get(),
            generatedAt: generatedAt,
            generatorVersion: 'runtime-image-bundled-v1',
            pluginMarkers: [
                    [id: 'ch.so.agi.gretl', group: 'ch.so.agi.gretl', module: 'ch.so.agi.gretl.gradle.plugin', version: version],
                    [id: 'ch.so.agi.gretl.geotools', group: 'ch.so.agi.gretl.geotools',
                     module: 'ch.so.agi.gretl.geotools.gradle.plugin', version: version]
            ],
            duckDbExtensions: [],
            artifacts: records
    ])) + System.lineSeparator()

    File checksums = new File(manifests, 'checksums.sha256')
    checksums.text = records.collect { record -> "${record.sha256}  ${record.relativePath}" }.join(System.lineSeparator()) + System.lineSeparator()

    List<Map> nodes = []
    files.findAll { it.name.endsWith('.pom') }.each { File pomFile ->
        String path = relative(pomFile)
        String[] parts = path.split('/')
        if (parts.length < 4) return
        String group = parts[0..<(parts.length - 3)].join('.')
        String module = parts[-3]
        String moduleVersion = parts[-2]
        def pom = new groovy.util.XmlSlurper(false, false).parse(pomFile)
        List<String> dependencies = pom.dependencies.dependency.collect { dependency ->
            [dependency.groupId.text(), dependency.artifactId.text(), dependency.version.text()]
                    .join(':')
        }.findAll { it != '::' }
        nodes << [coordinate: "${group}:${module}:${moduleVersion}", dependencies: dependencies.sort()]
    }
    File closure = new File(manifests, 'dependency-closure.json')
    closure.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            roots: [
                    "ch.so.agi.gretl:ch.so.agi.gretl.gradle.plugin:${version}",
                    "ch.so.agi.gretl.geotools:ch.so.agi.gretl.geotools.gradle.plugin:${version}",
                    "ch.so.agi:gretl-core:${version}",
                    "ch.so.agi:gretl-geotools:${version}"
            ],
            nodes: nodes.sort { a, b -> a.coordinate <=> b.coordinate }
    ])) + System.lineSeparator()
}

tasks.register('stageRuntimeImage', Sync) {
    group = 'distribution'
    description = 'Stages the Docker runtime image context with plugin Maven publications and runtime jars.'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    dependsOn ':gretl-core:publishAllPublicationsToRuntimeImageRepository'
    dependsOn ':gretl-geotools:publishAllPublicationsToRuntimeImageRepository'
    dependsOn tasks.named('materializeRuntimeImageDependencies')
    dependsOn ':gretl-core:jar'
    dependsOn ':gretl-geotools:jar'
    inputs.property('gradleSha256', runtimeImageGradleSha256)
    inputs.property('duckDbExtensionVersion', runtimeImageDuckDbExtensionVersion)

    into runtimeImageDir

    from('docker') {
        include 'Dockerfile'
        include 'gretl'
        include 'init.gradle'
    }
    from(runtimeImageRepoDir) {
        into 'maven-repo'
        exclude '**/*-sources.jar*'
        exclude '**/*-javadoc.jar*'
    }
    from(runtimeImageMaterializedRepoDir) {
        into 'maven-repo'
    }

    doLast {
        writeBundledManifests(destinationDir)
        new File(destinationDir, 'build.info').text = """GRETL Modular ${projectVersionString}
Gradle ${runtimeImageGradleVersion.get()}
Java ${runtimeImageJavaVersion.get()}
DuckDB extensions ${runtimeImageDuckDbExtensionVersion}
Repository /opt/gretl/maven-repository
Init /opt/gretl/init/gretl.init.gradle
Dependency policy local-only Gradle resolution (no remote downloads)
"""
    }
}

