tasks.register('verifyRuntimeImageDependencyClosureDistribution') {
    group = 'verification'
    description = 'Verifies the bundled Maven repository, manifests and dependency closure before the Docker build.'
    dependsOn tasks.named('prepareRuntimeImageDependencyClosure')
    doLast {
        File context = runtimeImageDir.get().asFile
        File repository = new File(context, 'maven-repo')
        File manifestFile = new File(context, 'manifests/bundled-artifacts.json')
        File closureFile = new File(context, 'manifests/dependency-closure.json')
        ['Dockerfile', 'gretl', 'init.gradle', 'build.info', 'maven-repo',
         'manifests/bundled-artifacts.json', 'manifests/dependency-closure.json', 'manifests/checksums.sha256'].each { String required ->
            if (!new File(context, required).exists()) {
                throw new GradleException("Dependency-closed runtime-image context is missing '${required}' under ${context}.")
            }
        }
        def requireFile = { File file, String description ->
            if (!file.isFile() || file.length() == 0) {
                throw new GradleException("Missing bundled runtime-image artifact ${description}: ${file}")
            }
            file
        }
        String dockerfile = new File(context, 'Dockerfile').getText('UTF-8')
        if (!dockerfile.contains('eclipse-temurin:17-jre@sha256:92999aea37688157a53a40bfcb187c30f317422e028045fd5fc5c548fde9e626')
                || !dockerfile.contains('sha256sum -c -')
                || !dockerfile.contains('DUCKDB_EXTENSION_VERSION')) {
            throw new GradleException('Runtime-image Dockerfile does not enforce the pinned base, Gradle checksum and DuckDB version contract.')
        }
        if (!(runtimeImageGradleSha256.get() ==~ /[0-9a-f]{64}/)) {
            throw new GradleException('Gradle distribution SHA-256 must contain 64 lowercase hex characters.')
        }
        String version = projectVersionString
        def artifact = { String group, String module, String artifactVersion, String extension ->
            File directory = new File(repository, "${group.replace('.', '/')}/${module}/${artifactVersion}")
            File base = new File(directory, "${module}-${artifactVersion}.${extension}")
            if (base.isFile()) return base
            String physicalVersion = artifactVersion.endsWith('-SNAPSHOT')
                    ? artifactVersion.substring(0, artifactVersion.length() - '-SNAPSHOT'.length()) : artifactVersion
            List<File> timestamped = directory.listFiles()?.findAll { File candidate ->
                candidate.name.startsWith("${module}-${physicalVersion}-")
                        && candidate.name.endsWith(".${extension}")
                        && !candidate.name.endsWith('.sha1') && !candidate.name.endsWith('.md5')
                        && !candidate.name.endsWith('.sha256') && !candidate.name.endsWith('.sha512')
            }?.sort { File left, File right -> left.name <=> right.name } ?: []
            timestamped ? timestamped.last() : base
        }
        requireFile(artifact('ch.so.agi.gretl', 'ch.so.agi.gretl.gradle.plugin', version, 'pom'), 'core plugin marker POM')
        requireFile(artifact('ch.so.agi.gretl.geotools', 'ch.so.agi.gretl.geotools.gradle.plugin', version, 'pom'), 'GeoTools plugin marker POM')
        requireFile(artifact('ch.so.agi', 'gretl-core', version, 'jar'), 'core implementation JAR')
        requireFile(artifact('ch.so.agi', 'gretl-core', version, 'pom'), 'core implementation POM')
        requireFile(artifact('ch.so.agi', 'gretl-geotools', version, 'jar'), 'GeoTools implementation JAR')
        requireFile(artifact('ch.so.agi', 'gretl-geotools', version, 'pom'), 'GeoTools implementation POM')

        def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
        Set<String> manifestPaths = [] as LinkedHashSet
        manifest.artifacts.each { record ->
            String relativePath = record.relativePath.toString()
            if (!manifestPaths.add(relativePath)) {
                throw new GradleException("Bundled artifact manifest contains duplicate path: ${relativePath}")
            }
            if (relativePath.startsWith('/') || relativePath.contains('..')) {
                throw new GradleException("Bundled artifact manifest contains non-relative path: ${relativePath}")
            }
            if (relativePath.contains('-sources.jar') || relativePath.contains('-javadoc.jar')
                    || relativePath.endsWith('.lock') || relativePath.endsWith('gc.properties')) {
                throw new GradleException("Forbidden file in bundled runtime-image distribution: ${relativePath}")
            }
            File file = new File(repository, relativePath)
            requireFile(file, relativePath)
            if (file.length() != record.size as long || sha256File(file) != record.sha256.toString()) {
                throw new GradleException("Checksum or size mismatch for bundled artifact ${relativePath}")
            }
        }
        String initText = new File(context, 'init.gradle').getText('UTF-8')
        if (initText.contains('mavenLocal()') || initText.contains('fileTree') || initText.contains('flatDir')
                || initText.contains('0.1.0-SNAPSHOT') || initText.contains('services.gradle.org')) {
            throw new GradleException('Runtime-image init.gradle contains a forbidden repository, fallback or stale version.')
        }
        String repositoryText = repository.toPath().toFile().toString()
        repository.eachFileRecurse { File file ->
            if (file.isFile()) {
                String text = file.name.toLowerCase()
                if (text.endsWith('-sources.jar') || text.endsWith('-javadoc.jar') || text == 'settings.xml') {
                    throw new GradleException("Forbidden file in repository: ${file}")
                }
                if (file.getText('UTF-8').contains(repositoryText) && !file.name.endsWith('.jar')) {
                    throw new GradleException("Bundled metadata contains a host path: ${file}")
                }
            }
        }

        // Traverse exact Maven POM edges.  This is intentionally independent
        // of the host Gradle cache and catches a copied JAR without its POM.
        Set<String> visited = [] as LinkedHashSet
        List<String> queue = [
                "ch.so.agi.gretl:ch.so.agi.gretl.gradle.plugin:${version}",
                "ch.so.agi.gretl.geotools:ch.so.agi.gretl.geotools.gradle.plugin:${version}",
                "ch.so.agi:gretl-core:${version}",
                "ch.so.agi:gretl-geotools:${version}",
                'org.geotools:gt-main:' + runtimeImageGeotoolsVersion,
                'org.geotools:gt-shapefile:' + runtimeImageGeotoolsVersion,
                'org.geotools:gt-geotiff:' + runtimeImageGeotoolsVersion,
                'org.geotools:gt-coverage:' + runtimeImageGeotoolsVersion,
                'org.geotools:gt-epsg-hsql:' + runtimeImageGeotoolsVersion
        ]
        while (!queue.isEmpty()) {
            String coordinate = queue.remove(0)
            if (!visited.add(coordinate)) continue
            String[] parts = coordinate.split(':', 3)
            if (parts.length != 3 || parts.any { it.contains('+') || it.contains('[') || it.contains(']') }) {
                throw new GradleException("Dynamic or invalid dependency coordinate in runtime-image dependency closure: ${coordinate}")
            }
            File pomFile = artifact(parts[0], parts[1], parts[2], 'pom')
            requireFile(pomFile, "POM ${coordinate}")
            def pom = new groovy.util.XmlSlurper(false, false).parse(pomFile)
            String packaging = pom.packaging.text()
            if (!packaging || packaging == 'jar') {
                requireFile(artifact(parts[0], parts[1], parts[2], 'jar'), "JAR ${coordinate}")
            }
            pom.dependencies.dependency.each { dependency ->
                String scope = dependency.scope.text()
                if (scope in ['test', 'provided', 'system', 'import']) return
                String depVersion = dependency.version.text()
                if (!depVersion || depVersion.contains('$') || depVersion == 'latest.release' || depVersion == 'latest.integration') {
                    throw new GradleException("Dependency ${coordinate} has no exact version: ${dependency.artifactId.text()}")
                }
                queue.add("${dependency.groupId.text()}:${dependency.artifactId.text()}:${depVersion}")
            }
        }
        ['commons-io:commons-io', 'org.xerial:sqlite-jdbc', 'org.postgresql:postgresql', 'org.duckdb:duckdb_jdbc'].each { required ->
            if (!visited.any { it.startsWith(required + ':') }) {
                throw new GradleException("Runtime-image dependency closure is missing ${required}")
            }
        }
        if (!visited.any { it.startsWith('org.geotools:gt-main:') }
                || !visited.any { it.startsWith('org.geotools:gt-shapefile:') }
                || !visited.any { it.startsWith('org.geotools:gt-epsg-hsql:') }) {
            throw new GradleException('Runtime-image GeoTools dependency closure is incomplete.')
        }
        def geotoolsJar = artifact('ch.so.agi', 'gretl-geotools', version, 'jar')
        new java.util.jar.JarFile(geotoolsJar).withCloseable { jar ->
            String prefix = 'gretl-geotools-worker-classpath/'
            ['gretl-geotools-', 'lib/gt-main-', 'lib/gt-shapefile-', 'lib/gt-geotiff-', 'lib/gt-coverage-', 'lib/gt-epsg-hsql-'].each { required ->
                if (!jar.entries().toList().any { it.name.startsWith(prefix + required) && it.name.endsWith('.jar') }) {
                    throw new GradleException("GeoTools worker JAR is missing embedded dependency ${required}")
                }
            }
        }
        def closure = new groovy.json.JsonSlurper().parse(closureFile)
        if ((closure.nodes ?: []).isEmpty()) {
            throw new GradleException('Dependency-closure report is empty.')
        }
        println "Verified ${manifest.artifacts.size()} bundled files and ${visited.size()} exact Maven coordinates."
    }
}

tasks.register('verifyRuntimeImageDependencyClosurePrerequisites') {
    group = 'verification'
    description = 'Verifies Docker and the dependency-closed image context before mandatory image tests.'
    dependsOn tasks.named('verifyRuntimeImageDependencyClosureDistribution')
    doLast {
        try {
            [['docker', 'version', '--format', '{{.Server.Version}}'],
             ['docker', 'info', '--format', '{{.OSType}}/{{.Architecture}}']].each { List<String> command ->
                Process process = new ProcessBuilder(command).redirectErrorStream(true).start()
                String output = process.inputStream.getText('UTF-8')
                if (process.waitFor() != 0) {
                    throw new IOException("${command.join(' ')} failed: ${output}")
                }
                println output.trim()
            }
        } catch (Exception e) {
            throw new GradleException('Docker is required for runtimeImageDependencyClosureTest; no silent skip is allowed.', e)
        }
    }
}

