    geowCustomFunctionsVersion = '0.2.1'
    geowNgkFunctionsVersion = '1.0.3'
    geotoolsVersion = '34.2'
    ili2cCoreVersion = '5.6.8'
    ili2cToolVersion = '5.6.8'
    ioxWkfVersion = '2.0.1-SNAPSHOT'
    ioxFormatsVersion = '1.0.3'
    av2chVersion = '1.1.8'
    av2geobauVersion = '1.4.2'
    jacksonVersion = '2.17.2'
    junitVersion = '5.10.3'
    saxonVersion = '11.4'
    sqliteJdbcVersion = '3.43.0.0'
    postgresqlVersion = '42.6.0'
    duckdbVersion = '1.5.2.0'
    awsSdkVersion = '2.15.64'
    mockFtpServerVersion = '2.7.1'
    testcontainersVersion = '1.21.4'
    testcontainersFlociVersion = '1.10.0'
    springBootVersion = '3.5.14'
    quartzVersion = '2.3.2'
}

subprojects {
    group = rootProject.group
    version = rootProject.version

    configurations.configureEach {
        exclude group: 'xml-apis', module: 'xml-apis'
        exclude group: 'xml-apis', module: 'xml-apis-ext'
        // Keep one DuckDB JDBC baseline across the modular plugin classpath,
        // including ili2duckdb 5.5.1 and the native DuckDbSqlExecutor tasks.
        resolutionStrategy.force("org.duckdb:duckdb_jdbc:${duckdbVersion}")
    }

    plugins.withId('maven-publish') {
        publishing {
            repositories {
                maven {
                    name = 'runtimeImage'
                    url = rootProject.layout.buildDirectory.dir('runtime-image/maven-repo').get().asFile.toURI()
                }
                maven {
                    name = 'publishedTest'
                    url = publishedTestRepoDir.get().asFile.toURI()
                }
                maven {
                    name = 'interlisGuruSnapshots'
                    url = uri('https://jars.interlis.guru/snapshots')
                    credentials {
                        username = publishUsername.orNull
                        password = publishPassword.orNull
                    }
                }
            }
        }
    }

    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(17)
            }
            withSourcesJar()
            withJavadocJar()
        }

        tasks.withType(JavaCompile).configureEach {
            options.release = 17
            options.encoding = 'UTF-8'
        }

        tasks.withType(Javadoc).configureEach {
            options.addBooleanOption('Xdoclint:none', true)
            options.quiet()
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }
    }
}

def runtimeImageDir = layout.buildDirectory.dir('runtime-image/docker')
def runtimeImageRepoDir = layout.buildDirectory.dir('runtime-image/maven-repo')
def dockerImageName = providers.gradleProperty('gretlDockerImage').orElse('sogis/gretl-modular:test')
def externalRuntimeClasspath = { String projectPath ->
    File gradleLibDir = gradle.gradleHomeDir == null ? null : new File(gradle.gradleHomeDir, 'lib').canonicalFile
    project(projectPath).configurations.runtimeClasspath.files.findAll { File file ->
        !file.name.startsWith('gradle-api-') &&
                (gradleLibDir == null || !file.canonicalPath.startsWith(gradleLibDir.canonicalPath + File.separator))
    }
}

tasks.register('cleanRuntimeImageRepository', Delete) {
    delete runtimeImageRepoDir
}

tasks.register('cleanPublishedTestRepository', Delete) {
    delete publishedTestRepoDir
}

tasks.register('publishSnapshots') {
    group = 'publishing'
    description = 'Publishes all GRETL snapshot publications to the interlisGuruSnapshots repository.'
}

subprojects {
    plugins.withId('maven-publish') {
        tasks.matching { it.name.endsWith('ToRuntimeImageRepository') }.configureEach {
            dependsOn rootProject.tasks.named('cleanRuntimeImageRepository')
        }

        tasks.matching { it.name.endsWith('ToPublishedTestRepository') }.configureEach {
            dependsOn rootProject.tasks.named('cleanPublishedTestRepository')
        }

        rootProject.tasks.named('publishSnapshots').configure {
            dependsOn tasks.named('publishAllPublicationsToInterlisGuruSnapshotsRepository')
        }
    }
}

tasks.register('preparePublishedTestRepository') {
    group = 'verification'
    description = 'Publishes GRETL Core and GeoTools plugin artifacts to an isolated local Maven repository for black-box tests.'

    dependsOn ':gretl-core:publishAllPublicationsToPublishedTestRepository'
    dependsOn ':gretl-geotools:publishAllPublicationsToPublishedTestRepository'
}

tasks.register('verifyPublishedTestRepository') {
    group = 'verification'
    description = 'Verifies GRETL plugin markers, implementation POMs and packaged worker runtime in the published-test repository.'
    dependsOn tasks.named('preparePublishedTestRepository')
    inputs.dir publishedTestRepoDir
    inputs.property 'gretlVersion', provider { project.version.toString() }

    doLast {
        File repository = publishedTestRepoDir.get().asFile
        String version = project.version.toString()

        def coordinate = { String groupId, String artifactId, String artifactVersion ->
            "${groupId}:${artifactId}:${artifactVersion}"
        }
        def artifactFile = { String groupId, String artifactId, String artifactVersion, String extension ->
            File versionDirectory = new File(repository, "${groupId.replace('.', '/')}/${artifactId}/${artifactVersion}")
            File baseFile = new File(versionDirectory, "${artifactId}-${artifactVersion}.${extension}")
            if (baseFile.isFile()) {
                return baseFile
            }
            // Maven repositories timestamp SNAPSHOT publications. Resolve the physical file
            // referenced by maven-metadata.xml while retaining the logical GRETL coordinate.
            String physicalVersion = artifactVersion.endsWith('-SNAPSHOT')
                    ? artifactVersion.substring(0, artifactVersion.length() - '-SNAPSHOT'.length())
                    : artifactVersion
            List<File> timestampedFiles = versionDirectory.listFiles()?.findAll { File candidate ->
                candidate.name.startsWith("${artifactId}-${physicalVersion}-")
                        && candidate.name.endsWith(".${extension}")
                        && !candidate.name.endsWith('.sha1')
                        && !candidate.name.endsWith('.md5')
                        && !candidate.name.endsWith('.sha256')
                        && !candidate.name.endsWith('.sha512')
            }?.sort { File left, File right -> left.name <=> right.name } ?: []
            timestampedFiles.isEmpty() ? baseFile : timestampedFiles.last()
        }
        def requireFile = { File artifact, String description ->
            if (!artifact.isFile()) {
                throw new GradleException("Missing published GRETL artifact for ${description}: ${artifact}")
            }
            artifact
        }
        def parsePom = { File pomFile ->
            new groovy.util.XmlSlurper(false, false).parse(pomFile)
        }
        def dependencies = { pom ->
            pom.dependencies.dependency.collect { dependency ->
                [
                        group: dependency.groupId.text(),
                        artifact: dependency.artifactId.text(),
                        version: dependency.version.text(),
                        scope: dependency.scope.text()
                ]
            }
        }
        def verifyImplementationPom = { String groupId, String artifactId ->
            String implementationCoordinate = coordinate(groupId, artifactId, version)
            File pomFile = requireFile(
                    artifactFile(groupId, artifactId, version, 'pom'), implementationCoordinate)
            def pom = parsePom(pomFile)
            Map<String, String> expectedCoordinates = [groupId: groupId, artifactId: artifactId, version: version]
            expectedCoordinates.each { String element, String expected ->
                String actual = pom."${element}".text()
                if (actual != expected) {
                    throw new GradleException(
                            "Implementation POM ${pomFile} has ${element} '${actual}'; "
                                    + "expected '${expected}' for ${implementationCoordinate}.")
                }
            }
            String pomText = pomFile.getText('UTF-8')
            ['build/classes', 'build/libs', '/src/'].each { String forbidden ->
                if (pomText.contains(forbidden)) {
                    throw new GradleException(
                            "Implementation POM ${pomFile} contains forbidden source/build reference '${forbidden}'.")
                }
            }
            File moduleFile = requireFile(
                    artifactFile(groupId, artifactId, version, 'module'), implementationCoordinate + ' module metadata')
            String moduleText = moduleFile.getText('UTF-8')
            ['build/classes', 'build/libs', '/src/'].each { String forbidden ->
                if (moduleText.contains(forbidden)) {
                    throw new GradleException(
                            "Gradle module metadata ${moduleFile} contains forbidden source/build reference '${forbidden}'.")
                }
            }
            [pom: pom, dependencies: dependencies(pom), file: pomFile]
        }
        def verifyMarker = { String markerGroup, String markerArtifact, String implementationGroup, String implementationArtifact ->
            String markerCoordinate = coordinate(markerGroup, markerArtifact, version)
            File markerPom = requireFile(
                    artifactFile(markerGroup, markerArtifact, version, 'pom'), markerCoordinate)
            def markerDependencies = dependencies(parsePom(markerPom))
            if (markerDependencies.size() != 1) {
                throw new GradleException(
                        "Plugin marker ${markerCoordinate} must contain exactly one implementation dependency; "
                                + "found ${markerDependencies.size()} in ${markerPom}.")
            }
            Map<String, String> expected = [group: implementationGroup, artifact: implementationArtifact, version: version]
            expected.each { String element, String expectedValue ->
                String actual = markerDependencies[0][element]
                if (actual != expectedValue) {
                    throw new GradleException(
                            "Plugin marker ${markerCoordinate} points to "
                                    + "${markerDependencies[0].group}:${markerDependencies[0].artifact}:${markerDependencies[0].version}; "
                                    + "expected ${implementationGroup}:${implementationArtifact}:${version}. "
                                    + "Wrong ${element} value '${actual}', expected '${expectedValue}'.")
                }
            }
        }
        def verifyPluginDescriptor = { File jarFile, String pluginId, String implementationClass ->
            String descriptorPath = "META-INF/gradle-plugins/${pluginId}.properties"
            new java.util.jar.JarFile(jarFile).withCloseable { jarFileHandle ->
                def descriptorEntry = jarFileHandle.getJarEntry(descriptorPath)
                if (descriptorEntry == null) {
                    throw new GradleException(
                            "Published JAR ${jarFile} is missing plugin descriptor ${descriptorPath}.")
                }
                Properties properties = new Properties()
                jarFileHandle.getInputStream(descriptorEntry).withCloseable { properties.load(it) }
                String actual = properties.getProperty('implementation-class')
                if (actual != implementationClass) {
                    throw new GradleException(
                            "Plugin descriptor ${descriptorPath} in ${jarFile} has implementation-class '${actual}'; "
                                    + "expected '${implementationClass}'.")
                }
            }
        }

        File coreJar = requireFile(
                artifactFile('ch.so.agi', 'gretl-core', version, 'jar'),
                coordinate('ch.so.agi', 'gretl-core', version))
        File geotoolsJar = requireFile(
                artifactFile('ch.so.agi', 'gretl-geotools', version, 'jar'),
                coordinate('ch.so.agi', 'gretl-geotools', version))

        verifyImplementationPom('ch.so.agi', 'gretl-core')
        verifyImplementationPom('ch.so.agi', 'gretl-geotools')
        verifyMarker('ch.so.agi.gretl', 'ch.so.agi.gretl.gradle.plugin', 'ch.so.agi', 'gretl-core')
        verifyMarker('ch.so.agi.gretl.geotools', 'ch.so.agi.gretl.geotools.gradle.plugin', 'ch.so.agi', 'gretl-geotools')
        verifyPluginDescriptor(coreJar, 'ch.so.agi.gretl', 'ch.so.agi.gretl.gradle.GretlPlugin')
        verifyPluginDescriptor(geotoolsJar, 'ch.so.agi.gretl.geotools', 'ch.so.agi.gretl.geotools.GretlGeotoolsPlugin')

        def coreDependencies = dependencies(parsePom(artifactFile('ch.so.agi', 'gretl-core', version, 'pom')))
        ['commons-io:commons-io', 'org.xerial:sqlite-jdbc', 'org.postgresql:postgresql', 'org.duckdb:duckdb_jdbc'].each { String expectedCoordinate ->
            String[] parts = expectedCoordinate.split(':')
            def dependency = coreDependencies.find { it.group == parts[0] && it.artifact == parts[1] }
            if (dependency == null) {
                throw new GradleException(
                        "Core implementation POM ${coordinate('ch.so.agi', 'gretl-core', version)} is missing dependency ${expectedCoordinate}.")
            }
            if (['org.xerial', 'org.postgresql', 'org.duckdb'].contains(parts[0])
                    && dependency.scope != '' && dependency.scope != 'runtime') {
                throw new GradleException(
                        "Core implementation POM dependency ${expectedCoordinate} has scope '${dependency.scope}'; "
                                + "expected runtime or an absent scope.")
            }
        }

        new java.util.jar.JarFile(geotoolsJar).withCloseable { jarFileHandle ->
            List<String> entries = jarFileHandle.entries().toList().collect { it.name }
            String workerPrefix = 'gretl-geotools-worker-classpath/'
            List<String> workerEntries = entries.findAll { it.startsWith(workerPrefix) }
            if (workerEntries.isEmpty()) {
                throw new GradleException(
                        "Published gretl-geotools JAR ${geotoolsJar} has no entries under ${workerPrefix}.")
            }
            List<String> forbiddenWorkerEntries = workerEntries.findAll {
                it.endsWith('-sources.jar') || it.endsWith('-javadoc.jar')
            }
            if (!forbiddenWorkerEntries.isEmpty()) {
                throw new GradleException(
                        "Published gretl-geotools JAR contains source/javadoc worker entries: "
                                + forbiddenWorkerEntries.join(', '))
            }
            def requiredWorkerEntries = [
                    ['worker runtime JAR', { it.startsWith(workerPrefix + 'gretl-geotools-') && it.endsWith('-worker-runtime.jar') }],
                    ['gt-main', { it.startsWith(workerPrefix + 'lib/gt-main-') && it.endsWith('.jar') }],
                    ['gt-geotiff', { it.startsWith(workerPrefix + 'lib/gt-geotiff-') && it.endsWith('.jar') }],
                    ['gt-coverage', { it.startsWith(workerPrefix + 'lib/gt-coverage-') && it.endsWith('.jar') }],
                    ['gt-shapefile', { it.startsWith(workerPrefix + 'lib/gt-shapefile-') && it.endsWith('.jar') }],
                    ['gt-epsg-hsql', { it.startsWith(workerPrefix + 'lib/gt-epsg-hsql-') && it.endsWith('.jar') }]
            ]
            requiredWorkerEntries.each { entryDefinition ->
                String description = entryDefinition[0]
                Closure<Boolean> matches = entryDefinition[1]
                List<String> matchesFound = workerEntries.findAll(matches)
                if (matchesFound.isEmpty()) {
                    String available = workerEntries.take(40).join(', ')
                    throw new GradleException(
                            "Published gretl-geotools JAR does not contain a worker dependency matching ${description}. "
                                    + "Available worker entries: ${available}")
                }
                if (description == 'worker runtime JAR') {
                    matchesFound.each { String entryName ->
                        def entry = jarFileHandle.getJarEntry(entryName)
                        if (entry.size <= 0) {
                            throw new GradleException(
                                    "Embedded GeoTools worker runtime entry ${entryName} in ${geotoolsJar} is empty.")
                        }
                    }
                }
            }
        }
    }
}

tasks.register('publishedArtifactTest') {
    group = 'verification'
    description = 'Verifies and executes the published GRETL Core and GeoTools Gradle plugin artifacts.'

    dependsOn tasks.named('verifyPublishedTestRepository')
    dependsOn ':gretl-core:publishedFunctionalTest'
    dependsOn ':gretl-core:publishedIntegrationTest'
    dependsOn ':gretl-geotools:publishedFunctionalTest'
}

tasks.register('stageRuntimeImage', Sync) {
    group = 'distribution'
    description = 'Stages the Docker runtime image context with plugin Maven publications and runtime jars.'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    dependsOn ':gretl-core:publishAllPublicationsToRuntimeImageRepository'
    dependsOn ':gretl-geotools:publishAllPublicationsToRuntimeImageRepository'
    dependsOn ':gretl-core:jar'
    dependsOn ':gretl-geotools:jar'

    into runtimeImageDir

    from('docker') {
        include 'Dockerfile'
        include 'gretl'
        include 'init.gradle'
    }
    from(runtimeImageRepoDir) {
        into 'maven-repo'
        exclude '**/*-sources.jar*'
        exclude '**/*-javadoc.jar*'
    }
    from({
        [
                project(':gretl-core').tasks.named('jar').get().archiveFile.get().asFile,
                project(':gretl-geotools').tasks.named('jar').get().archiveFile.get().asFile
        ]
    }) {
        into 'libs'
    }
    from({ externalRuntimeClasspath(':gretl-core') }) {
        into 'libs'
    }
    from({ externalRuntimeClasspath(':gretl-geotools') }) {
        into 'libs'
    }

    doLast {
        file("${destinationDir}/build.info").text = """GRETL Modular ${project.version}
Gradle ${gradle.gradleVersion}
Java 17
"""
    }
}

tasks.register('buildRuntimeImage', Exec) {
    group = 'distribution'
    description = 'Builds the local Docker runtime image. Override with -PgretlDockerImage=name:tag.'
    dependsOn tasks.named('stageRuntimeImage')
    workingDir runtimeImageDir.get().asFile
    commandLine 'docker', 'build', '-t', dockerImageName.get(), '.'
}

