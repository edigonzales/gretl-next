tasks.register('buildRuntimeImageForTest') {
    group = 'verification'
    description = 'Builds and records the immutable Docker image used by the dependency-closure gate.'
    dependsOn tasks.named('verifyRuntimeImageDependencyClosurePrerequisites')
    inputs.dir runtimeImageDir
    inputs.property('imageTag', runtimeImageTestTag)
    inputs.property('gretlVersion', projectVersionString)
    inputs.property('gradleVersion', runtimeImageGradleVersion)
    inputs.property('gradleSha256', runtimeImageGradleSha256)
    inputs.property('javaVersion', runtimeImageJavaVersion)
    inputs.property('duckDbExtensionVersion', runtimeImageDuckDbExtensionVersion)
    outputs.files(runtimeImageTestDir.map { it.file('image-id.txt') },
            runtimeImageTestDir.map { it.file('image-descriptor.json') })

    doFirst {
        File testDirectory = runtimeImageTestDir.get().asFile
        testDirectory.mkdirs()
        File imageIdFile = new File(testDirectory, 'image-id.txt')
        if (imageIdFile.exists()) {
            imageIdFile.delete()
        }
        if (imageIdFile.exists()) {
            throw new GradleException("Cannot remove stale runtime image ID file: ${imageIdFile}")
        }
        List<String> command = ['docker', 'build', '--pull=false',
                                '--iidfile', imageIdFile.absolutePath,
                                '--tag', runtimeImageTestTag.get(),
                                '--build-arg', "GRETL_VERSION=${projectVersionString}",
                                '--build-arg', "GRADLE_VERSION=${runtimeImageGradleVersion.get()}",
                                '--build-arg', "GRADLE_SHA256=${runtimeImageGradleSha256.get()}",
                                '--build-arg', "JAVA_VERSION=${runtimeImageJavaVersion.get()}",
                                '--build-arg', "DUCKDB_EXTENSION_VERSION=${runtimeImageDuckDbExtensionVersion}",
                                '.']
        Process process = new ProcessBuilder(command as String[])
                .directory(runtimeImageDir.get().asFile)
                .redirectErrorStream(true)
                .start()
        String output = process.inputStream.getText('UTF-8')
        if (process.waitFor() != 0) {
            throw new GradleException("Docker image build failed:\n${output}")
        }
        println output
    }

    doLast {
        File imageIdFile = runtimeImageTestDir.get().file('image-id.txt').asFile
        if (!imageIdFile.isFile()) {
            throw new GradleException("Docker did not create the runtime image ID file: ${imageIdFile}")
        }
        String imageId = imageIdFile.getText('UTF-8').trim()
        if (!(imageId ==~ /sha256:[0-9a-fA-F]{64}/)) {
            throw new GradleException("Invalid Docker image ID '${imageId}' in ${imageIdFile}.")
        }
        List<String> inspectCommand = ['docker', 'image', 'inspect', imageId]
        Process inspectProcess = new ProcessBuilder(inspectCommand as String[]).redirectErrorStream(true).start()
        String inspectOutput = inspectProcess.inputStream.getText('UTF-8')
        if (inspectProcess.waitFor() != 0) {
            throw new GradleException("Docker image inspection failed:\n${inspectOutput}")
        }
        List<String> taggedInspectCommand = ['docker', 'image', 'inspect', '--format', '{{.Id}}', runtimeImageTestTag.get()]
        Process taggedInspectProcess = new ProcessBuilder(taggedInspectCommand as String[]).redirectErrorStream(true).start()
        String taggedOutput = taggedInspectProcess.inputStream.getText('UTF-8')
        if (taggedInspectProcess.waitFor() != 0) {
            throw new GradleException("Docker tagged image inspection failed:\n${taggedOutput}")
        }
        String taggedId = taggedOutput.trim()
        if (taggedId != imageId) {
            throw new GradleException(
                "Runtime image tag '${runtimeImageTestTag.get()}' resolves to '${taggedId}', expected '${imageId}'.")
        }
        String commit = 'unknown'
        try {
            Process git = new ProcessBuilder(['git', 'rev-parse', 'HEAD']).directory(runtimeImageRepositoryRoot).start()
            String output = git.inputStream.getText('UTF-8').trim()
            if (git.waitFor() == 0 && output) commit = output
        } catch (Exception ignored) {
            // Source archives do not necessarily contain .git.
        }
        File descriptor = runtimeImageTestDir.get().file('image-descriptor.json').asFile
        descriptor.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                imageId: imageId,
                imageTag: runtimeImageTestTag.get(),
                gretlVersion: projectVersionString,
                gradleVersion: runtimeImageGradleVersion.get(),
                gradleSha256: runtimeImageGradleSha256.get(),
                javaVersion: runtimeImageJavaVersion.get(),
                duckDbExtensionVersion: runtimeImageDuckDbExtensionVersion,
                repositoryPath: '/opt/gretl/maven-repository',
                readOnlyCachePath: null,
                initScriptPath: '/opt/gretl/init/gretl.init.gradle',
                buildCommit: commit
        ])) + System.lineSeparator()
    }
}

