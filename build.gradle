def runtimeImageDependencyMetadata = files()
def xmlEscape = { String value ->
    value.replace('&', '&amp;')
            .replace('<', '&lt;')
            .replace('>', '&gt;')
            .replace('"', '&quot;')
            .replace("'", '&apos;')
}
def sha256File = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[64 * 1024]
        int read
        while ((read = input.read(buffer)) >= 0) {
            if (read > 0) {
                digest.update(buffer, 0, read)
            }
        }
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

// The plugin publications contain the GRETL module POMs.  The runtime image
// also needs every resolved runtime module behind those POMs so that Gradle
// can resolve the distribution with an empty cache and --offline.  Materialize
// a small Maven repository from the already-resolved Gradle graph instead of
// injecting an unstructured jar directory into every consumer buildscript.
tasks.register('materializeRuntimeImageDependencies') {
    group = 'distribution'
    description = 'Materializes the resolved GRETL runtime dependency closure as Maven metadata.'
    dependsOn ':gretl-core:publishAllPublicationsToRuntimeImageRepository'
    dependsOn ':gretl-geotools:publishAllPublicationsToRuntimeImageRepository'
    inputs.files(runtimeImageDependencyMetadata)
    outputs.dir runtimeImageMaterializedRepoDir

    doLast {
        File publishedRepository = runtimeImageRepoDir.get().asFile
        File repository = runtimeImageMaterializedRepoDir.get().asFile
        List<Map> runtimeImageDependencyRecords = runtimeImageDependencyMetadata.files
                .sort { left, right -> left.absolutePath <=> right.absolutePath }
                .collectMany { metadata ->
                    new groovy.json.JsonSlurper().parse(metadata).records as List<Map>
                }
        Map<String, Map> dependenciesByCoordinate = runtimeImageDependencyRecords.collectEntries {
            [it.coordinate, it]
        }
        Map<String, File> artifactsByCoordinate = [:]
        Map<String, File> fallbackArtifactsByModule = [:]
        Set<String> exactPublishedCoordinates = new LinkedHashSet<>()
        runtimeImageDependencyRecords.each { record ->
            if (record.jarPath != null) {
                File artifact = new File(record.jarPath)
                artifactsByCoordinate[record.coordinate] = artifact
                fallbackArtifactsByModule["${record.moduleGroup}:${record.moduleName}"] = artifact
            }
        }

        // A published POM can retain a directly declared version even when the
        // host configuration selected a newer version through conflict
        // resolution. Resolve every direct dependency declared by the two
        // plugin POMs as an exact root as well, so the image contains the
        // coordinates Gradle will request in an isolated offline build.
        List<File> pluginPoms
        try (def paths = java.nio.file.Files.walk(publishedRepository.toPath())) {
            pluginPoms = paths
                    .filter { path ->
                        String value = publishedRepository.toPath().relativize(path).toString()
                        (value ==~ /ch\/so\/agi\/gretl-core\/[^\/]+\/gretl-core-[^\/]+\.pom/)
                                || (value ==~ /ch\/so\/agi\/gretl-geotools\/[^\/]+\/gretl-geotools-[^\/]+\.pom/)
                    }
                    .map { path -> path.toFile() }
                    .collect()
        }
        pluginPoms.each { File pluginPom ->
            def parsed = new groovy.util.XmlSlurper(false, false).parse(pluginPom)
            parsed.dependencies.dependency.each { dependencyNode ->
                String group = dependencyNode.groupId.text()
                String name = dependencyNode.artifactId.text()
                String version = dependencyNode.version.text()
                if (!group.isBlank() && !name.isBlank() && !version.isBlank()) {
                    exactPublishedCoordinates.add("${group}:${name}:${version}")
                }
            }
        }

        Set<String> allCoordinates = new LinkedHashSet<>(dependenciesByCoordinate.keySet())
        allCoordinates.addAll(exactPublishedCoordinates)
        allCoordinates.each { String coordinate ->
            def dependency = dependenciesByCoordinate[coordinate]
            String[] coordinateParts = coordinate.split(':', 3)
            String coordinateGroup = dependency == null ? coordinateParts[0] : dependency.moduleGroup
            String coordinateName = dependency == null ? coordinateParts[1] : dependency.moduleName
            String coordinateVersion = dependency == null ? coordinateParts[2] : dependency.moduleVersion
            File versionDirectory = new File(repository,
                    "${coordinateGroup.replace('.', '/')}/${coordinateName}/${coordinateVersion}")
            versionDirectory.mkdirs()
            File artifact = artifactsByCoordinate[coordinate]
            if (artifact == null) {
                artifact = fallbackArtifactsByModule["${coordinateGroup}:${coordinateName}"]
            }
            if (artifact != null) {
                File target = new File(versionDirectory, "${coordinateName}-${coordinateVersion}.jar")
                if (!target.isFile() || sha256File(target) != sha256File(artifact)) {
                    java.nio.file.Files.copy(artifact.toPath(), target.toPath(),
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }

            File pom = new File(versionDirectory, "${coordinateName}-${coordinateVersion}.pom")
            if (!pom.isFile()) {
                String childPom = dependency == null ? '' : dependency.children
                        .collect { childCoordinate -> dependenciesByCoordinate[childCoordinate] }
                        .findAll { it != null }
                        .collect { child ->
                            """        <dependency>
            <groupId>${xmlEscape(child.moduleGroup)}</groupId>
            <artifactId>${xmlEscape(child.moduleName)}</artifactId>
            <version>${xmlEscape(child.moduleVersion)}</version>
            <scope>runtime</scope>
        </dependency>
"""
                        }.join('')
                pom.text = """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0"
         xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
         xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
    <modelVersion>4.0.0</modelVersion>
    <groupId>${xmlEscape(coordinateGroup)}</groupId>
    <artifactId>${xmlEscape(coordinateName)}</artifactId>
    <version>${xmlEscape(coordinateVersion)}</version>
    <packaging>${artifact == null ? 'pom' : 'jar'}</packaging>
    <dependencies>
${childPom}    </dependencies>
</project>
"""
            }
        }
    }
}

gradle.projectsEvaluated {
    def registerDependencyMetadata = { Project owner, String taskName, List configurations ->
        def outputFile = owner.layout.buildDirectory.file("runtime-image-dependencies/${taskName}.json")
        def metadataTask = owner.tasks.register(taskName) {
            group = 'distribution'
            description = 'Writes the resolved runtime dependency graph for image staging.'
            inputs.files(configurations)
            outputs.file(outputFile)
            doLast {
                Map<String, Map> recordsByCoordinate = [:]
                configurations.each { configuration ->
                    configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                        def module = artifact.moduleVersion.id
                        if (module.group != null && module.group.toString() != 'org.gradle'
                                && artifact.file.name.endsWith('.jar')) {
                            String coordinate = "${module.group}:${module.name}:${module.version}"
                            recordsByCoordinate[coordinate] = [
                                    coordinate: coordinate,
                                    moduleGroup: module.group.toString(),
                                    moduleName: module.name.toString(),
                                    moduleVersion: module.version.toString(),
                                    jarPath: artifact.file.absolutePath,
                                    jarSha256: sha256File(artifact.file),
                                    children: []
                            ]
                        }
                    }
                    configuration.incoming.resolutionResult.allComponents.each { component ->
                        def module = component.moduleVersion
                        if (module == null || module.group == null || module.group.toString() == 'org.gradle') {
                            return
                        }
                        String coordinate = "${module.group}:${module.name}:${module.version}"
                        Map record = recordsByCoordinate[coordinate] ?: [
                                coordinate: coordinate,
                                moduleGroup: module.group.toString(),
                                moduleName: module.name.toString(),
                                moduleVersion: module.version.toString(),
                                jarPath: null,
                                jarSha256: null,
                                children: []
                        ]
                        record.children = component.dependencies
                                .findAll { dependency -> dependency instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult }
                                .collect { dependency ->
                                    def child = dependency.selected.moduleVersion
                                    child == null ? null : "${child.group}:${child.name}:${child.version}"
                                }
                                .findAll { it != null }
                                .sort()
                        recordsByCoordinate[coordinate] = record
                    }
                }
                File output = outputFile.get().asFile
                output.parentFile.mkdirs()
                List<Map> records = recordsByCoordinate.values().sort { left, right ->
                    left.coordinate <=> right.coordinate
                }
                output.text = groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson([records: records])) + System.lineSeparator()
            }
        }
        runtimeImageDependencyMetadata.from(metadataTask)
        tasks.named('materializeRuntimeImageDependencies').configure {
            dependsOn metadataTask
        }
    }

    registerDependencyMetadata(project(':gretl-core'), 'writeRuntimeImageDependencyMetadata',
            [project(':gretl-core').configurations.runtimeClasspath])
    registerDependencyMetadata(project(':gretl-geotools'), 'writeRuntimeImageDependencyMetadata',
            [project(':gretl-geotools').configurations.runtimeClasspath,
             project(':gretl-geotools').configurations.workerRuntimeClasspath])
}

