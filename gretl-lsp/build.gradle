plugins {
    id 'java-library'
    id 'application'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

base {
    archivesName = 'gretl-lsp'
}

dependencies {
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.24.0'
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation 'org.codehaus.groovy:groovy:3.0.19'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
}

application {
    mainClass = 'ch.so.agi.gretl.lsp.server.GretlServerLauncher'
}

shadowJar {
    archiveClassifier = 'all'
    mergeServiceFiles()
}

tasks.register('copyLspMetadata', Copy) {
    group = 'build'
    description = 'Copies the generated LSP metadata JSON into the processResources output.'
    dependsOn rootProject.tasks.named('generateLspMetadata')

    def docletProject = project(':gretl-doclet')
    from docletProject.layout.buildDirectory.dir('generated/gretl-lsp-metadata')
    into layout.buildDirectory.dir('generated-resources/main/ch/so/agi/gretl/lsp/metadata')
    include 'gretl-lsp-metadata.json'
}

sourceSets {
    main {
        resources {
            srcDir layout.buildDirectory.dir('generated-resources/main')
        }
    }
}

tasks.named('processResources') {
    dependsOn 'copyLspMetadata'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
