<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GRETL Control</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>GRETL Control</h1>
      <p>Jobs, runs, workers and logs</p>
      <p id="manifest-status">Manifest not loaded.</p>
    </div>
    <div class="topbar-actions">
      <button id="reload-manifest" class="secondary">Reload Config</button>
      <button id="refresh">Refresh</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-header">
        <h2>Jobs</h2>
      </div>
      <div id="jobs" class="list"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Runs</h2>
      </div>
      <div id="runs" class="list"></div>
    </section>

    <section class="panel detail">
      <div class="panel-header">
        <h2>Details</h2>
      </div>
      <div id="details" class="details-empty">Select a job or run.</div>
      <pre id="logs" class="logs"></pre>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Workers</h2>
      </div>
      <div id="workers" class="list"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
